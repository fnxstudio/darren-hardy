<meta name="robots" content="noindex, nofollow">
<style>
/* CHAMPION INVITE CONFIRMATION (DEMO, staging only). A copy of /pre-print-event-confirmation in the Midnight look of
   /champion-invite and the Founders Event page. Section and text colours are native page-only combos (is-midnight,
   pp-btn.is-steel); this block holds what Webflow can't: the numbered steps, order number, ticket chip, signature. */
body { background-color: #03050A; }
/* numbered steps (from the original page), as steel discs */
.cf-steps { counter-reset: cf; }
.cf-step { counter-increment: cf; }
.cf-step::before { content: counter(cf); position: absolute; left: 0; top: 16px; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(110deg, #9AA1AC 0%, #E9ECF0 22%, #BCC2CB 44%, #F8F9FB 62%, #A3AAB4 100%); color: #0A0C10; box-shadow: 0 0 0 1px rgba(230,236,245,.4), 0 0 18px rgba(190,205,230,.25); font-family: bebas-neue-pro-semiexpanded, 'Bebas Neue', sans-serif; font-size: 20px; font-weight: 600; line-height: 36px; text-align: center; }
.cf-steps.is-midnight .cf-step { border-color: rgba(170,190,220,.18); }
.cf-step-note.is-midnight em { color: #DCE3EE; }
/* the two gift lines are part of the hero copy (same type as the paragraph above), each led by a small steel check */
.cf-gift-line::before { content: "\2713"; display: inline-block; vertical-align: 2px; width: 18px; height: 18px; margin-right: 10px; border-radius: 50%; background: linear-gradient(110deg, #9AA1AC 0%, #E9ECF0 22%, #BCC2CB 44%, #F8F9FB 62%, #A3AAB4 100%); color: #0A0C10; font-size: 10px; font-weight: 700; line-height: 18px; text-align: center; box-shadow: 0 0 10px rgba(190,205,230,.3); }
/* order number from ?order= (script in the footer) */
.ei-order-no { display: none; }
.ei-order-no.is-on { display: block; }
/* steel buttons: slow shine, never darker on hover */
.pp-btn.is-steel { position: relative; overflow: hidden; isolation: isolate; }
.pp-btn.is-steel::after { content: ""; position: absolute; z-index: -1; top: -30%; bottom: -30%; left: -50%; width: 38%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55) 45%, rgba(255,255,255,.95) 50%, rgba(255,255,255,.55) 55%, transparent); animation: ci-shine 6.5s ease-in-out infinite; pointer-events: none; }
@keyframes ci-shine { 0%, 62% { left: -50%; } 100% { left: 130%; } }
.pp-btn:focus-visible { outline: 2px solid #C9CED6; outline-offset: 4px; }
/* the confirmation chip (ticket + "Founders enrollment confirmed") */
.cf-hero.is-midnight .ei-confirm { background: linear-gradient(160deg, #1C2C48 0%, #0D1626 100%); border-color: rgba(170,190,220,.24); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 30px 60px -30px rgba(0,0,0,.8); }
.cf-hero.is-midnight .ei-confirm-text { color: #F2F4F8; }
.cf-hero.is-midnight .ei-order-no { color: #8090AB; }
.cf-hero.is-midnight .ei-confirm-ticket { filter: drop-shadow(0 0 1px rgba(236,240,247,.8)) drop-shadow(0 0 16px rgba(190,205,230,.4)); }
/* Darren's signature is black ink: white on the dark ground */
.cf-block-end.is-midnight .cf-sign-name { filter: invert(1); opacity: .9; }
@media (prefers-reduced-motion: reduce) { .pp-btn.is-steel::after { animation: none; } }
</style>
