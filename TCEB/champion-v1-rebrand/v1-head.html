/* ==== FOUNDERS EVENT THEME (2026-11-03, v2 after DH: less black): midnight blue grounds alternate with white, grey and steel sections. Neutral greys only, no light blue. Delete this block to go back to the old gold-on-white look ==== */
.champ-page {
  --fe-midnight: #0B1526; --fe-mid2: #13264A; --fe-mid3: #1B2F55;
  --fe-line: rgba(255,255,255,.14); --fe-line2: rgba(255,255,255,.26);
  --fe-mute: #9A9DA3; --fe-soft: #C8CACE; --fe-bright: #F4F5F6; --fe-ash: #8E9094; --fe-silver: #B9BBBF; --fe-plat: #DCDDDF;
  --fe-ink: #0A0C10; --fe-ink2: #3A3E46; --fe-grey: #5F646D; --fe-rule: rgba(11,21,38,.12);
  --fe-steel: linear-gradient(110deg, #9AA1AC 0%, #E9ECF0 22%, #BCC2CB 44%, #F8F9FB 62%, #A3AAB4 100%);
  --fe-band: linear-gradient(100deg, #8C939E 0%, #E3E6EA 18%, #C3C8CF 40%, #F5F6F8 60%, #A6ACB5 100%);
  --fe-foil: linear-gradient(115deg, #8A6E43 0%, #E6CF9F 22%, #B8975F 42%, #F3E3BE 58%, #9C7C4B 78%, #DCC08C 100%);
  --fe-ash-steel: linear-gradient(150deg, #C9CDD3 0%, #8E949C 45%, #5E646D 100%);
  --fe-btn-mid: linear-gradient(160deg, #1C2C48, #0D1626);
  --fe-ground: radial-gradient(45% 60% at 12% 30%, rgba(42,72,128,.45), transparent 70%), radial-gradient(45% 60% at 88% 70%, rgba(42,72,128,.35), transparent 70%), var(--fe-midnight);
  --ink: var(--fe-soft); --grey: var(--fe-mute); --line: var(--fe-line); --field: var(--fe-mid2); --gold: #C3C8CF; --gold-ink: var(--fe-plat);
  --g-gold: var(--fe-foil); --g-silver: var(--fe-steel); --g-copper: var(--fe-ash-steel);
  background: var(--fe-midnight); color: var(--fe-soft);
}
