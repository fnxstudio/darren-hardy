<script>
/* PRE-PRINT INTRO VIDEO, part 2 of 2 (part 1, in the page head, decides whether this visit shows it).
   Darren's message covers the page on the first visit. On computers it plays straight away where the browser allows
   sound to start on its own. Where it doesn't (most browsers on a first visit), Vimeo would start it silently;
   instead it is stopped and the cover (the video's Vimeo thumbnail) shows with a glowing "Click to see Darren's
   private message" button on his shirt, clear of his face. A small label in the
   top-right corner shows the video's length, then ticks down while it plays. Once it's playing, a clear layer keeps
   Vimeo's hover controls hidden; a brand-red button in the bottom-right corner pauses and resumes it, and the button
   beside it steps the speed (1x, 1.25x, 1.5x, 1.75x, 2x). Vimeo's own icons never show. Both lift above the cookie banner while it's up.
   From 5:27, when he says "click the button right now" (after the deadline), a "Reserve my copies" button takes
   them straight to the bundles.
   When the video ends, the overlay fades out and the page is free. Re-watching (?rewatch=1) adds a close button. The visit is remembered as soon as
   the overlay shows, so it never shows again in this browser.
   Safety net: if Vimeo can't load or connect, the overlay closes and the page shows. */
(function () {
  var h = document.documentElement;
  if (!h.classList.contains('pp-intro')) return;
  var VIDEO = '1237601091';
  // Autoplay is only tried on computers. Phones only autoplay muted, and a phone won't let this page turn the sound
  // back on (only a tap inside the player can), so there the video simply waits for the visitor's tap.
  var AUTO = matchMedia('(hover:hover) and (pointer:fine)').matches ? 1 : 0;
  // Opened again from the hero's "Re-watch" link: this time it gets a close button (the first visit has none)
  var REWATCH = /[?&]rewatch=1\b/.test(location.search);
  try { localStorage.setItem('tceb-pp-intro', '1'); } catch (e) {}

  var ov = document.createElement('div');
  ov.className = 'pp-intro-ov';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', "Darren's private message");
  ov.innerHTML = '<div class="pp-intro-stage">' +
    '<iframe src="https://player.vimeo.com/video/' + VIDEO + '?autoplay=' + AUTO + '&dnt=1&title=0&byline=0&portrait=0&playsinline=1' +
    '&color=e02826&colors=000000,e02826,ffffff,000000&cc=0&pip=0&transcript=0&quality_selector=0&airplay=0&chromecast=0&speed=1&volume=0&progress_bar=0&fullscreen=0&play_button_position=bottom"' +
    ' allow="autoplay; encrypted-media" title="Darren\'s private message"></iframe>' +
    '<div class="pp-intro-cover" aria-hidden="true">' +
    '<span class="pp-intro-play"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="none" stroke="#fff" stroke-width="2"/>' +
    '<path d="M16 12.5v15l12-7.5z" fill="#fff"/></svg>Click to see Darren\'s private message</span></div>' +
    '<span class="pp-intro-time" aria-hidden="true">5:47</span>' +
    '<button type="button" class="pp-intro-go">Reserve my copies <span aria-hidden="true">&rarr;</span></button>' +
    '<div class="pp-intro-shield" aria-hidden="true"></div><div class="pp-intro-mask" aria-hidden="true"></div>' +
    '<button type="button" class="pp-intro-speed" aria-label="Playback speed">1&times;</button>' +
    '<button type="button" class="pp-intro-pp" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"></svg></button>' +
    (REWATCH ? '<button type="button" class="pp-intro-x" aria-label="Close video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' : '') + '</div>';
  document.body.appendChild(ov);
  h.classList.add('pp-intro-ready');

  var cover = ov.querySelector('.pp-intro-cover'), frame = ov.querySelector('iframe'), player = null, closed = false;
  var clock = ov.querySelector('.pp-intro-time'), go = ov.querySelector('.pp-intro-go');
  var pp = ov.querySelector('.pp-intro-pp'), shield = ov.querySelector('.pp-intro-shield'), speed = ov.querySelector('.pp-intro-speed');
  var RATES = [1, 1.25, 1.5, 1.75, 2], rate = 0;
  // The cover is the video's current Vimeo thumbnail, read live so a thumbnail change in Vimeo shows here too
  if (window.fetch) fetch('https://vimeo.com/api/oembed.json?width=1920&url=' + encodeURIComponent('https://vimeo.com/' + VIDEO))
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.thumbnail_url) cover.style.backgroundImage = 'url("' + d.thumbnail_url + '")'; })
    .catch(function () {});
  speed.addEventListener('click', function () {
    if (!player) return;
    rate = (rate + 1) % RATES.length;
    player.setPlaybackRate(RATES[rate]).then(function () { speed.innerHTML = RATES[rate] + '&times;'; }, function () { rate = 0; });
  });
  var ICON_PLAY = '<path d="M8 5v14l11-7z"/>', ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  // Paused, or just started: Vimeo's own icons can show for a moment, so the bottom-left patch covers them (head CSS)
  var fresh;
  function showPlaying(on) {
    pp.querySelector('svg').innerHTML = on ? ICON_PAUSE : ICON_PLAY; pp.setAttribute('aria-label', on ? 'Pause' : 'Play');
    ov.classList.toggle('is-paused', !on);
    if (on) { ov.classList.add('is-fresh'); clearTimeout(fresh); fresh = setTimeout(function () { ov.classList.remove('is-fresh'); }, 4000); }
  }
  function toggle() {
    if (!player) return;
    player.getPaused().then(function (paused) { (paused ? player.play() : player.pause()).catch(function () {}); }, function () {});
  }
  pp.addEventListener('click', toggle);
  shield.addEventListener('click', toggle);   // a tap on the video itself pauses / resumes too
  // The thumbnail stays up until the first frame plays (no black while it buffers); its button goes straight away
  function nowPlaying() { started = true; cover.querySelector('.pp-intro-play').style.display = 'none'; shield.classList.add('is-on'); pp.classList.add('is-on'); speed.classList.add('is-on'); showPlaying(true); }
  var GO_AT = 327;   // 5:27, where Darren says "click the button right now" (after the deadline)
  function mmss(t) { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }
  function close() {
    if (closed) return;
    closed = true;
    ov.classList.add('is-out');
    h.classList.remove('pp-intro');
    setTimeout(function () { ov.remove(); }, 600);
  }
  var connect = setTimeout(close, 12000);   // never connected: let the visitor in
  if (REWATCH) {
    // On press, not click: the site's cookie banner takes a new visitor's first click on the page as consent and swallows it
    var shut = function (e) { if (e) e.preventDefault(); if (player) player.pause().catch(function () {}); close(); };
    ov.querySelector('.pp-intro-x').addEventListener('pointerdown', shut);
    ov.querySelector('.pp-intro-x').addEventListener('click', shut);   // keyboard (Enter / Space)
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') shut(); });
    // A page refresh after closing shouldn't bring it back
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }

  // The cookie banner (computers) covers the bottom of the screen until it's answered: lift the corner buttons above it meanwhile
  var stage = ov.querySelector('.pp-intro-stage');
  var lifter = setInterval(function () {
    if (closed) { clearInterval(lifter); return; }
    var d = document.getElementById('CybotCookiebotDialog'), lift = 0;
    if (d) {
      var cs = getComputedStyle(d), r = d.getBoundingClientRect(), sb = stage.getBoundingClientRect().bottom;
      if (cs.display !== 'none' && cs.visibility !== 'hidden' && +cs.opacity > 0 && r.height && r.top < sb) lift = Math.ceil(sb - r.top) + 12;
    }
    stage.style.setProperty('--pp-lift', lift + 'px');
  }, 400);

  // "Reserve my copies": close the video and jump to the bundles. It acts on press, not click, because the site's
  // cookie banner takes a new visitor's first click on the page as consent and swallows it.
  var gone = false;
  function toOffer(e) {
    if (gone) return;
    gone = true;
    if (e) e.preventDefault();
    if (player) player.pause().catch(function () {});
    close();
    var b = document.getElementById('bundles');
    if (b) window.scrollTo(0, Math.max(0, b.getBoundingClientRect().top + window.pageYOffset));
  }
  go.addEventListener('pointerdown', toOffer);
  go.addEventListener('click', toOffer);   // keyboard (Enter / Space)

  // The cover is only a picture: a click or tap on it lands on the Vimeo player underneath, so the player
  // starts with sound from the visitor's own click (phones don't allow it any other way).
  var started = false;
  // Phones: Vimeo can take the first tap as "show controls" rather than "play". The tap moves focus into the player,
  // so if it hasn't started a moment later, start it from here; that tap counts as the visitor's permission.
  if (!AUTO) window.addEventListener('blur', function () {
    if (started || document.activeElement !== frame) return;
    setTimeout(function () { if (!started && player) player.play().catch(function () {}); }, 600);
  });
  var s = document.createElement('script');
  s.src = 'https://player.vimeo.com/api/player.js';
  s.onload = function () {
    try {
      player = new Vimeo.Player(frame);
      player.ready().then(function () { clearTimeout(connect); ov.classList.add('is-ready'); if (AUTO) frame.focus({ preventScroll: true }); }, close);   // the button shows once a click will work (focus only on computers: on phones the tap itself must move focus, see above)
      player.getDuration().then(function (d) { if (d && !started) clock.textContent = mmss(d); }, function () {});   // the video's real length
      player.setLoop(false).catch(function () {});
      player.on('pause', function () { if (started) showPlaying(false); });
      player.on('play', function () {
        if (started) { showPlaying(true); return; }
        // Started on its own: keep it only if it has sound, otherwise stop and wait for the click
        player.getMuted().then(function (muted) {
          if (!muted) { nowPlaying(); return; }
          // started on its own without sound: stop, rewind and turn the sound on, ready for the visitor's click
          player.pause().catch(function () {});
          player.setCurrentTime(0).catch(function () {});
          player.setMuted(false).catch(function () {});
        }, function () {});
      });
      player.on('timeupdate', function (d) {
        if (!started) { player.getMuted().then(function (m) { if (m) { player.pause().catch(function () {}); player.setCurrentTime(0).catch(function () {}); player.setMuted(false).catch(function () {}); } }, function () {}); return; }   // still silent: keep it stopped
        if (d.seconds > 0.1) cover.hidden = true;
        if (d.duration) clock.textContent = mmss(d.duration - d.seconds);
        if (d.seconds >= GO_AT && !go.classList.contains('is-on')) go.classList.add('is-on');
        if (d.duration && d.duration - d.seconds < 0.4) close();
      });
      player.on('ended', close);
    } catch (e) { close(); }
  };
  s.onerror = close;
  document.head.appendChild(s);
})();
</script>
