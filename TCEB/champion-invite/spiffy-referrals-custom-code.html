<script>
/* TCEB Founders Event, REFERRALS cart (the-compound-effect-in-business-founders-event-referrals).
   Spiffy > this checkout > Settings > custom code. Paste this whole file, script tags included.
   Built on the tested Founders carts code, trimmed to this cart (VIP only, no team seats, no coupon) and
   recoloured to the Midnight + silver look of /champion-invite. Two rules from last time:
   - No dollar signs anywhere: Spiffy's save step rewrites a dollar sign followed by digits. The code builds the
     dollar sign itself (D below), and has no backslash escapes, so copying it through a doc can't change it.
   - Nothing touches the form until Spiffy's app has settled (part 0), or the form can crash on phones.
   If this code doesn't run at all, the plain Spiffy form still works: VIP checkbox, plans, Join button. */

var D = String.fromCharCode(36), NB = String.fromCharCode(160);   // dollar sign, no-break space

/* 0. Wait for Spiffy's checkout to settle: page fully loaded AND no changes for half a second (6s cap). Spiffy's hidden
      countdown timer ticks several times a second, so its changes don't count (otherwise it never goes quiet). */
function tcebAfterMount(fn) {
  var done = false;
  function go() { if (done) return; done = true; setTimeout(fn, 0); }
  if (!document.getElementById('__nuxt')) { go(); return; }
  function settle() {
    var quiet, cap = setTimeout(finish, 6000);
    var mo = new MutationObserver(function (rs) {
      if (rs.every(tick)) return;
      clearTimeout(quiet); quiet = setTimeout(finish, 500);
    });
    function tick(r) { var t = r.target.nodeType === 1 ? r.target : r.target.parentElement; return !!(t && t.closest && t.closest('.countdown-timer, .exit-discount-banner')); }
    function finish() { clearTimeout(quiet); clearTimeout(cap); mo.disconnect(); go(); }
    mo.observe(document.documentElement, { childList: true, subtree: true });
    quiet = setTimeout(finish, 500);
  }
  if (document.readyState === 'complete') settle(); else window.addEventListener('load', settle);
}

/* Which payment plan is picked: the first plan card is "Pay in installments", the second "Pay in full". */
function tcebMonthly() {
  var r = document.querySelector('input[name^="basicPayplans"]:checked');
  var all = document.querySelectorAll('input[name^="basicPayplans"]');
  return !r || r === all[0];
}

/* 1. Order Details: name what this cart's price already includes. The seat price here has the publisher's
      sponsorship and the Champion's Gift Card built in (no coupon), so two lines are added under the items,
      styled like them: "REARDEN SPONSORSHIP (5,000 dollar value)  INCLUDED" and "1,000 dollar Gift Card  INCLUDED"
      (both shown with a dollar sign). Display only; Spiffy's math is untouched. Redrawn whenever Spiffy redraws
      the summary (picking a plan, ticking VIP). */
(function () {
  var css = document.createElement('style');
  css.textContent = '.tceb-inc{font-size:.8em;letter-spacing:.08em}';
  document.head.appendChild(css);
  var WANT = [['REARDEN SPONSORSHIP (' + D + '5,000 value)', '<span class="tceb-inc">INCLUDED</span>'],
              ['Your ' + D + '1,000 Gift Card', '<span class="tceb-inc">INCLUDED</span>']];
  var KEY = JSON.stringify(WANT);
  function draw() {
    document.querySelectorAll('.order-summary__slide').forEach(function (list) {
      var mine = list.querySelectorAll('.tceb-line');
      if (list.getAttribute('data-tceb') === KEY && mine.length === WANT.length &&
          list.lastElementChild === mine[mine.length - 1]) return;   // already right
      mine.forEach(function (el) { el.remove(); });
      var proto = list.querySelector('.line-item__group');
      WANT.forEach(function (w) {
        var el = document.createElement('div');
        if (proto) for (var i = 0; i < proto.attributes.length; i++) {
          if (/^data-v-/.test(proto.attributes[i].name)) el.setAttribute(proto.attributes[i].name, '');
        }
        el.className = 'list-group-item row no-gutters line-item__group tceb-line';
        el.innerHTML = '<div class="col"><p class="line-item__group_name">' + w[0] + '</p></div>' +
          '<div class="text-right col-auto"><p class="line-item__group_price">' + w[1] + '</p></div>';
        list.appendChild(el);
      });
      list.setAttribute('data-tceb', KEY);
    });
  }
  tcebAfterMount(function () {
    draw();
    new MutationObserver(draw).observe(document.documentElement, { childList: true, subtree: true });
  });
})();

/* 2. VIP box. Finds the section holding the VIP checkbox and builds the box around it: steel corner tab, headline,
      grey line, label, bullets, price on the right (installment or pay-in-full price, following the plan picked), and a
      "Get more details from Darren" link that plays Darren's VIP video inline. The checkbox row becomes the Midnight
      action row (as in the mock form), relabelled "Add VIP to my seat" (Spiffy's own price badge is hidden).
      Also takes the apostrophe out of "FOUNDER'S" on the Join button. If this doesn't run, the plain checkbox
      shows and still works. */
(function () {
  var VIP = {
    tab: 'Extra half-day with Darren',
    monthly: ['Only ' + D + '124.62 today', '+' + D + '124.62 for 11 months'],
    full: ['Only ' + D + '1,495', 'Pre-paid in full'],
    head: 'YES! Make me a VIP',
    sub: 'Private additional session · April' + NB + '28,' + NB + '2027',
    label: 'VIP-only exclusives',
    bullets: ['A pre-event meetup',
      'A private room during the event',
      'Two weeks of event recordings'],
    video: '1236615000'
  };

  var font = document.createElement('link');
  font.rel = 'stylesheet';
  font.href = 'https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap';
  document.head.appendChild(font);

  var STEEL = 'linear-gradient(110deg,#9AA1AC 0%,#E9ECF0 22%,#BCC2CB 44%,#F8F9FB 62%,#A3AAB4 100%)';
  var css = document.createElement('style');
  css.textContent =
    '.tceb-box .card{position:relative;overflow:hidden}' +
    '.tceb-tab{position:absolute;top:0;right:0;z-index:1;padding:9px 12px;border-radius:0 2px 0 2px;background:' + STEEL + ';color:#0A0C10;font-size:10px;font-weight:700;letter-spacing:.18em;line-height:1;text-transform:uppercase}' +
    '.tceb-box .section__inner{padding:38px 20px 20px!important;border-color:rgba(10,12,16,.28)!important}' +
    '.tceb-content{position:relative;color:#0A0C10}' +
    '.tceb-head{margin:0 0 8px;padding-right:170px;font-family:"Bebas Neue",sans-serif;font-size:28px;font-weight:400;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:#0A0C10}' +
    '.tceb-sub{margin:0 0 12px;padding-right:170px;color:#6B7280;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}' +
    '.tceb-label{margin:14px 0 6px;color:#1C2C48;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}' +
    '.tceb-list{display:grid;gap:4px;margin:0;padding-left:18px;color:#3A404B;font-size:14px;line-height:1.55}' +
    '.tceb-more{padding:0;border:0;background:none;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}' +
    '.tceb-price{position:absolute;top:0;right:0;text-align:right}' +
    '.tceb-price b{display:block;color:#0A0C10;font-size:14px;font-weight:600;line-height:1.25}' +
    '.tceb-price small{display:block;margin-top:3px;color:#6B7280;font-size:11px}' +
    '.tceb-video{position:relative;margin-top:12px;padding-top:56.25%;background:#000}' +
    '.tceb-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}' +
    '.tceb-close{position:absolute;top:8px;right:8px;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 10px;border:0;border-radius:2px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}' +
    '.tceb-vip .layout-checkboxes1{flex:none;width:100%;max-width:100%;margin:18px 0 0;padding:16px;border-radius:2px;background:linear-gradient(160deg,#1C2C48,#0D1626)}' +
    '.tceb-vip .layout-checkboxes1 .form-group,.tceb-vip .layout-checkboxes1 .custom-control{margin-bottom:0!important}' +
    '.tceb-vip .custom-control{padding-left:0}' +
    '.tceb-vip .custom-control-label{position:relative;display:flex;align-items:center;min-height:18px;padding-left:32px;color:#F2F4F8!important;font-size:15px;font-weight:600;line-height:1.3;cursor:pointer}' +
    '.tceb-vip .custom-control-label::before,.tceb-vip .custom-control-label::after{top:50%!important;left:0!important;width:18px!important;height:18px!important;margin-top:-9px!important}' +
    '.tceb-vip .custom-control-label::before{border:1px solid rgba(242,244,248,.35)!important;border-radius:2px;background:#fff;box-shadow:none}' +
    '.tceb-vip .custom-control-input:checked~.custom-control-label::before{border-color:#E4E8EE!important;background:' + STEEL + '!important}' +
    '.tceb-vip .custom-control-input:checked~.custom-control-label::after{filter:invert(1)}' +
    '.tceb-vip .custom-control-label::after{background-size:12px}' +
    '.tceb-vip .option-price{display:none!important}' +
    '@media (max-width:600px){.tceb-box .section__inner{padding-top:40px!important}.tceb-head,.tceb-sub{padding-right:0}' +
    '.tceb-content{display:flex;flex-direction:column}.tceb-head{order:1}.tceb-sub{order:2}.tceb-label,.tceb-list{order:4}.tceb-video{order:5}' +
    '.tceb-price{order:3;position:static;margin:0 0 12px;text-align:left}}';
  document.head.appendChild(css);

  function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

  function price(box) {
    var p = tcebMonthly() ? VIP.monthly : VIP.full, el = box.querySelector('.tceb-price');
    var html = '<b>' + esc(p[0]) + '</b><small>' + esc(p[1]) + '</small>';
    if (el && el.innerHTML !== html) el.innerHTML = html;
  }

  function build(sec) {
    var card = sec.querySelector('.card'), inner = sec.querySelector('.section__inner') || card;
    if (!card) return;
    var box = card.querySelector('.tceb-content');
    if (box) { price(box); return; }
    var tab = document.createElement('span');
    tab.className = 'tceb-tab'; tab.textContent = VIP.tab;
    card.insertBefore(tab, card.firstChild);

    box = document.createElement('div');
    box.className = 'tceb-content';
    box.innerHTML =
      '<div class="tceb-price"></div>' +
      '<h3 class="tceb-head">' + esc(VIP.head) + '</h3>' +
      '<p class="tceb-sub">' + esc(VIP.sub) + '</p>' +
      '<p class="tceb-label">' + esc(VIP.label) + '</p>' +
      '<ul class="tceb-list">' + VIP.bullets.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') +
      '<li><button type="button" class="tceb-more">Get more details from Darren →</button></li></ul>';
    inner.insertBefore(box, inner.firstChild);
    price(box);

    // Darren's video plays under the bullets; the link (or the Close button on the video) closes it again
    var more = box.querySelector('.tceb-more'), LINK = more.textContent;
    function close() { var open = box.querySelector('.tceb-video'); if (open) open.remove(); more.textContent = LINK; }
    more.addEventListener('click', function () {
      if (box.querySelector('.tceb-video')) { close(); return; }
      var v = document.createElement('div');
      v.className = 'tceb-video';
      v.innerHTML = '<button type="button" class="tceb-close" aria-label="Close the video">Close <span aria-hidden="true">&times;</span></button>' +
        '<iframe src="https://player.vimeo.com/video/' + VIP.video + '?autoplay=1&title=0&byline=0&portrait=0&color=C9CED6&cc=0&pip=0&transcript=0&quality_selector=0&airplay=0&chromecast=0&speed=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Darren on the VIP upgrade"></iframe>';
      v.querySelector('.tceb-close').addEventListener('click', close);
      box.appendChild(v);
      more.textContent = 'Close the video ×';
    });
  }

  function relabel(label) {
    for (var n = label.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 3 && n.nodeValue.trim()) {
        if (n.nodeValue.trim() !== 'Add VIP to my seat') n.nodeValue = ' Add VIP to my seat ';
        return;
      }
    }
  }

  function scan() {
    document.querySelectorAll('[id^="block-"]').forEach(function (b) {
      var cbLabel = b.querySelector('input[type="checkbox"] ~ label');
      if (cbLabel && /vip/i.test(cbLabel.textContent)) {
        var sec = b.closest('.section');
        if (sec) {
          if (!sec.classList.contains('tceb-vip')) sec.classList.add('tceb-box', 'tceb-vip');
          build(sec);
        }
        relabel(cbLabel);
      }
    });
    // Join button: FOUNDER'S -> FOUNDERS
    document.querySelectorAll('button, .btn').forEach(function (btn) {
      for (var n = btn.firstChild; n; n = n.nextSibling) {
        if (n.nodeType === 3 && /FOUNDER['’]S/i.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/(FOUNDER)['’](S)/gi, function (m, a, b) { return a + b; });
      }
    });
  }
  tcebAfterMount(function () {
    var tries = 0;
    (function wait() { scan(); if (!document.querySelector('.tceb-vip .tceb-content') && tries++ < 100) setTimeout(wait, 100); })();
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
    document.addEventListener('change', function (e) {   // the VIP price follows the plan picked
      if (e.target && /^basicPayplans/.test(e.target.name || '')) { var box = document.querySelector('.tceb-vip .tceb-content'); if (box) price(box); }
    });
  });
})();
</script>
