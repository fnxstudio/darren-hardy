<style>
/* INVITE VIDEO CONTROLS (same block on all three invite pages; the script is in the footer).
   Vimeo's own buttons must never show. The player runs with play_button_position=bottom, so Vimeo has no big centre
   button; its only icons are a play box in the bottom-left (56x32, 8px in) and a speed box in the bottom-right
   (40x32, 8px in). Our running time (bottom-left) and speed button (bottom-right) sit exactly over them, solid, so
   neither can ever be seen; our round red play/pause sits just left of the speed button. The cover shows from the
   start for the same reason (Vimeo's icons show while the player loads).
   Before play: the video's Vimeo thumbnail as a cover with the glowing "Click to get Darren's special invite" button,
   clear of Darren's chin. The cover is a picture only, so the tap lands on the Vimeo player itself (phones only start
   it that way); the button sits as low as it can and still start the video (taps in the bottom ~42px of the player
   land on Vimeo's control strip). It's sized by the player's width, not the screen's: slim on any player under 600px.
   Type, weight, corners and the red lacquer finish (brand guide 2.5: a lit top edge, a deeper base, a long soft shadow)
   match the page's red buttons (.pp-btn.is-solid), so the two read as one family. */
.ei-player{container-type:inline-size}
.ei-vc-cover{position:absolute;inset:0;z-index:1;background:#000 center/cover no-repeat;pointer-events:none}
.ei-player:not(.ei-vc-ready) .ei-vc-start{visibility:hidden}
/* Once tapped the button goes; the thumbnail stays until the first frame plays (no black while it buffers) */
.ei-player.ei-vc-on .ei-vc-start{display:none}
.ei-player.ei-vc-live .ei-vc-cover{display:none}
.ei-vc-start{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:14px;padding:12px 30px 12px 12px;border-radius:2px;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.24) 0%,rgba(255,255,255,0) 55%),linear-gradient(180deg,#E8233B 0%,#E1132E 45%,#A50F1E 100%);color:#fff;font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;line-height:1.3;text-transform:uppercase;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 30px -14px rgba(225,19,46,.55),0 22px 40px -24px rgba(0,0,0,.35)}
.ei-vc-start svg{flex:none;width:30px;height:30px}
@container (max-width:600px){.ei-vc-start{bottom:44px;gap:6px;padding:4px 11px 4px 5px;font-size:10px;letter-spacing:.04em}
.ei-vc-start svg{width:20px;height:20px}}
/* Chrome / Edge on a computer: a real button with the hand cursor (script below) */
.ei-vc-click .ei-vc-start{pointer-events:auto;cursor:pointer}
/* Glow: a red halo that breathes in and out (opacity only). It starts flush with the button: a gap here showed the
   dark video through as a black frame around the button */
.ei-vc-start::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:2px;box-shadow:0 0 26px 8px rgba(225,19,46,.85);opacity:.25;animation:ei-vc-glow 1.6s ease-in-out infinite}
@keyframes ei-vc-glow{50%{opacity:1}}
/* Running time: the length before play, then it ticks down. Over Vimeo's play box (left 8-64, bottom 8-40) */
.ei-vc-time{position:absolute;left:4px;bottom:6px;z-index:2;width:64px;height:40px;border-radius:8px;background:#111;color:#fff;font-size:14px;font-weight:700;letter-spacing:.04em;line-height:40px;text-align:center;font-variant-numeric:tabular-nums;pointer-events:none}
.ei-vc-shield{position:absolute;inset:0;z-index:1;display:none;cursor:pointer}
.ei-player.ei-vc-on .ei-vc-shield{display:block}
/* Round red play/pause, just left of the speed button */
.ei-vc-pp{position:absolute;right:66px;bottom:4px;z-index:2;display:none;align-items:center;justify-content:center;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:50%;background:#e1132e;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.ei-vc-pp svg{width:18px;height:18px;fill:#fff}
/* Speed, in the corner over Vimeo's speed box (right 8-48, bottom 8-40) */
.ei-vc-speed{position:absolute;right:4px;bottom:6px;z-index:2;display:none;width:52px;height:40px;margin:0;padding:0;border:0;border-radius:8px;background:#111;color:#fff;font:inherit;font-size:14px;font-weight:700;letter-spacing:.02em;line-height:40px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.ei-player.ei-vc-on .ei-vc-pp{display:flex}
.ei-player.ei-vc-on .ei-vc-speed{display:block}
.ei-vc-pp:focus-visible,.ei-vc-speed:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.ei-vc-start::before{animation:none;opacity:.8}}
</style>
<script>
/* Hand cursor on the video start button: Chrome / Edge on a computer can start Vimeo with sound from a click on this
   page, so there the button is a real button (on press, so the cookie banner can't swallow the first click). Elsewhere
   (Safari, Firefox, phones) the click must land on Vimeo's own player, so the button stays a picture. */
(function () {
  if (!(navigator.userAgentData && matchMedia('(hover:hover) and (pointer:fine)').matches)) return;
  document.documentElement.classList.add('ei-vc-click');
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('.ei-vc-start'), f = b && document.querySelector('[data-vimeo]');
    if (f && window.Vimeo) new Vimeo.Player(f).play().catch(function () {});
  });
})();
</script>
