<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <!-- Outer ring -->
  <circle cx="55" cy="55" r="52" fill="none" stroke="#141414" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="55" cy="55" r="45" fill="none" stroke="#141414" stroke-width="0.75"/>
  <!-- Top label -->
  <text x="55" y="38" fill="#141414" font-family="Inter, sans-serif" font-size="8" font-weight="500" letter-spacing="3" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">AMAZON</text>
  <!-- Five stars -->
  <text x="55" y="62" fill="#141414" font-family="Inter, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
  <!-- No.1 -->
  <text x="55" y="76" fill="#141414" font-family="Inter, sans-serif" font-size="9" font-weight="900" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">No.1</text>
  <!-- Thin horizontal rule -->
  <line x1="28" y1="85" x2="82" y2="85" stroke="#141414" stroke-width="0.5"/>
  <!-- Bottom BESTSELLER -->
  <text x="55" y="96" fill="#141414" font-family="Inter, sans-serif" font-size="6.5" font-weight="500" letter-spacing="2.5" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">BESTSELLER</text>
</svg>
