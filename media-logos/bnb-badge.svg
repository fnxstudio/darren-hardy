<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <!-- Outer ring -->
  <circle cx="55" cy="55" r="52" fill="none" stroke="#141414" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="55" cy="55" r="45" fill="none" stroke="#141414" stroke-width="0.75"/>
  <!-- Top label line 1 -->
  <text x="55" y="38" fill="#141414" font-family="Inter, sans-serif" font-size="6.5" font-weight="500" letter-spacing="2" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">BARNES</text>
  <!-- Top label line 2 -->
  <text x="55" y="47" fill="#141414" font-family="Inter, sans-serif" font-size="6.5" font-weight="500" letter-spacing="2" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">&amp; NOBLE</text>
  <!-- Center B&N -->
  <text x="55" y="75" fill="#141414" font-family="Inter, sans-serif" font-size="22" font-weight="900" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">B&amp;N</text>
  <!-- Thin horizontal rule -->
  <line x1="28" y1="80" x2="82" y2="80" stroke="#141414" stroke-width="0.5"/>
  <!-- Bottom BESTSELLER -->
  <text x="55" y="92" fill="#141414" font-family="Inter, sans-serif" font-size="6.5" font-weight="500" letter-spacing="2.5" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">BESTSELLER</text>
</svg>
