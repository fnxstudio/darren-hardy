<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <!-- Outer ring -->
  <circle cx="55" cy="55" r="52" fill="none" stroke="#141414" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="55" cy="55" r="45" fill="none" stroke="#141414" stroke-width="0.75"/>
  <!-- Top label -->
  <text x="55" y="38" fill="#141414" font-family="Inter, sans-serif" font-size="7" font-weight="500" letter-spacing="2.5" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">USA TODAY</text>
  <!-- Center No.1 — "No." smaller, "1" large using tspan -->
  <text x="55" y="72" fill="#141414" font-family="Inter, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">
    <tspan font-size="14">No.</tspan><tspan font-size="28" dy="-2">1</tspan>
  </text>
  <!-- Thin horizontal rule -->
  <line x1="28" y1="80" x2="82" y2="80" stroke="#141414" stroke-width="0.5"/>
  <!-- Bottom BESTSELLER -->
  <text x="55" y="92" fill="#141414" font-family="Inter, sans-serif" font-size="6.5" font-weight="500" letter-spacing="2.5" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">BESTSELLER</text>
</svg>
