        f.setAttribute('allow','autoplay; fullscreen; picture-in-picture');
        f.setAttribute('allowfullscreen','');
        f.setAttribute('title','Darren Hardy on who DarrenDaily is for');
        slot.appendChild(f);
      }
      lb.classList.add('open'); lb.setAttribute('aria-hidden','false'); d.body.style.overflow='hidden';
      var c=lb.querySelector('.home-lightbox-close'); if(c)c.focus();
    }
    function close(){
      lb.classList.remove('open'); lb.setAttribute('aria-hidden','true'); d.body.style.overflow='';
      slot.innerHTML='';
      if(lastActive&&lastActive.focus)lastActive.focus();
    }
    d.querySelectorAll('[data-preview-open]').forEach(function(b){ b.addEventListener('click',open); });
    lb.querySelectorAll('[data-lb-close]').forEach(function(b){ b.addEventListener('click',close); });
    d.addEventListener('keydown',function(e){ if(e.key==='Escape'&&lb.classList.contains('open'))close(); });
  })();

  /* Role select goes from placeholder grey to ink once a real option is picked */
  var sel=d.getElementById('ddRole');
  if(sel){ var sync=function(){ sel.classList.toggle('dd-chosen',!!sel.value); }; sync(); sel.addEventListener('change',sync); }
})();
</script>
