<section class="sessions sec" id="sessions">

</div>

<div class="ep-metarow">
<span class="ep-meta ep-meta--date">Jul 23 · 2026</span>
</div>
</a>
<a class="ep-card f-stagger" href="https://dd.darrenhardy.com/high-achievers-do-on-saturdays">

</div>

</div>
