<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're In · DarrenDaily</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* --- inlined dd-welcome.css (our last version) --- */
@font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url(https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55322bf946a016bb09a_inter-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url(https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55322bf946a016bb0af_inter-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    /* Neutrals */
    --paper:         #ffffff;
    --mist:          #f3f5f8;
    --ink:           #14171c;
    --muted:         #545c68;
    --soft:          #616a78;
    --line:          rgba(20, 23, 28, 0.12);
    --line-soft:     rgba(20, 23, 28, 0.07);
    /* Brand accent (DarrenDaily red) */
    --accent:        #a72632;
    --accent-deep:   #812a37;
    --accent-bright: #cf3a45;
    --accent-rgb:    167, 38, 50;
    /* Dark bands / footer (deep maroon) */
    --dark:          #2a1015;
    --dark-2:        #1c0a0e;
    --mist-on-dark:  #e7d4d6;
    /* Tokens */
    --gold:          #ffce3a;
    --radius:        4px;
    --ease:          cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400; -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility; overflow-x: hidden;
  }
  a { color: inherit; }
  img { max-width: 100%; }

  /* ============ SHARED ============ */
  section { position: relative; scroll-margin-top: 96px; }
  .container { max-width: 1320px; margin: 0 auto; padding: 0 48px; }
  @media (max-width: 720px) { .container { padding: 0 22px; } }

  .eyebrow {
    font-weight: 700; font-size: 12px; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--soft);
    display: inline-flex; align-items: center; gap: 16px;
  }
  .eyebrow .pip { width: 34px; height: 3px; background: var(--accent); display: inline-block; }
  .eyebrow.accent { color: var(--accent); }
  .eyebrow.on-dark { color: rgba(255,255,255,0.82); }
  .eyebrow.on-dark .pip { background: var(--accent-bright); }
  .eyebrow.center { justify-content: center; }

  h1, h2, h3 { font-weight: 900; letter-spacing: -0.03em; line-height: 1.0; }
  em.key  { font-style: normal; color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    font-weight: 800; font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 20px 38px; border-radius: var(--radius); text-decoration: none; cursor: pointer;
    background: var(--accent); color: #fff; border: 2px solid var(--accent);
    transition: background .2s var(--ease), color .2s, transform .2s, box-shadow .2s;
    box-shadow: 0 14px 30px -12px rgba(var(--accent-rgb), 0.5);
    position: relative; overflow: hidden;
  }
  .btn:hover { background: #fff; color: var(--accent); transform: translateY(-2px); box-shadow: 0 18px 36px -14px rgba(var(--accent-rgb), 0.4); }
  .btn.ondark { background: var(--accent-bright); border-color: var(--accent-bright); }
  .btn.ondark:hover { background: #fff; color: var(--accent); border-color: #fff; box-shadow: 0 18px 36px -14px rgba(0,0,0,0.5); }
  .btn .arrow { transition: transform .2s var(--ease); }
  .btn:hover .arrow { transform: translateX(5px); }

  .btn-line {
    display: inline-flex; align-items: center; gap: 9px;
    font-weight: 700; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;
    text-decoration: none; color: var(--ink); cursor: pointer;
    border-bottom: 2px solid var(--accent); padding-bottom: 4px; transition: color .2s;
  }
  .btn-line:hover { color: var(--accent); }
  .btn-line.ondark { color: #fff; border-bottom-color: var(--accent-bright); }
  .btn-line.ondark:hover { color: var(--accent-bright); }
  .btn-line .arrow { transition: transform .2s var(--ease); }
  .btn-line:hover .arrow { transform: translateX(4px); }

  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }
  .stagger > * { opacity: 0; transform: translateY(26px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .stagger.in > * { opacity: 1; transform: none; }
  .stagger.in > *:nth-child(2) { transition-delay: .10s; }
  .stagger.in > *:nth-child(3) { transition-delay: .20s; }
  @media (prefers-reduced-motion: reduce) { .reveal, .stagger > * { opacity: 1 !important; transform: none !important; } }

  /* ============ NAV (solid, ink logo) ============ */
  nav.top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 60;
    display: flex; align-items: center; justify-content: space-between; padding: 20px 40px;
    background: transparent; transition: background .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease), padding .3s var(--ease);
    border-bottom: 1px solid transparent;
  }
  nav.top.solid {
    position: fixed; padding: 14px 40px; background: #fff;
    border-bottom: 1px solid var(--line); box-shadow: 0 6px 24px -14px rgba(20, 23, 28, 0.35);
  }
  .nav-brand { display: flex; align-items: center; text-decoration: none; white-space: nowrap; line-height: 1; }
  .nav-brand img { height: 34px; width: auto; display: block; }
  /* White logo over the photo hero, full-color logo once the bar goes solid */
  .nav-brand .logo-white { display: block; }
  .nav-brand .logo-color { display: none; }
  nav.top.solid .nav-brand .logo-white { display: none; }
  nav.top.solid .nav-brand .logo-color { display: block; }
  /* Shared nav action: red pill, fades in once the nav goes solid (matches darrendaily.html) */
  .nav-cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff !important; padding: 11px 20px; border-radius: var(--radius);
    font-weight: 700; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none;
    border: 2px solid var(--accent); font-family: inherit; cursor: pointer; -webkit-appearance: none; appearance: none;
    transition: background .2s, color .2s, opacity .35s var(--ease), transform .35s var(--ease);
    opacity: 0; transform: translateY(-6px); pointer-events: none;
  }
  nav.top.solid .nav-cta { opacity: 1; transform: none; pointer-events: auto; }
  .nav-cta:hover { background: transparent; color: var(--accent) !important; }
  .nav-cta:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 4px; }
  .nav-cta .arrow { transition: transform .2s var(--ease); }
  .nav-cta:hover .arrow { transform: translateX(4px); }
  @media (max-width: 720px) { nav.top { padding: 12px 22px; } nav.top.solid { padding: 12px 22px; } .nav-brand img { height: 30px; } .nav-cta { padding: 10px 16px; font-size: 10px; } }

  /* ============ HERO (immersive - blurred garden-chair bg, video IN the hero) ============ */
  .hero-confirm { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 0 84px; text-align: center; overflow: hidden; background: var(--mist); }
  .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; filter: blur(20px) brightness(1.02) saturate(1.14); transform: scale(1.16); z-index: 0; }
  .hero-confirm::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 76% 48% at 50% 32%, rgba(20,10,12,0.32), transparent 70%),
      linear-gradient(180deg, rgba(20,10,12,0.28) 0%, rgba(20,10,12,0.03) 24%, rgba(20,10,12,0.02) 56%, rgba(20,10,12,0.30) 100%);
  }
  .hero-confirm .container { position: relative; z-index: 2; width: 100%; max-width: 1720px; }
  .hero-confirm h1 { color: #fff; font-size: clamp(44px, 6.6vw, 100px); text-transform: uppercase; margin: 0; text-wrap: balance; text-shadow: 0 2px 44px rgba(0,0,0,0.45); opacity: 0; transform: translateY(14px); animation: heroUp 1s var(--ease) .1s forwards; }
  .hero-confirm h1 .dot { color: var(--accent-bright); }
  .hero-confirm .lead { font-size: clamp(17px, 1.5vw, 21px); line-height: 1.6; color: rgba(255,255,255,0.94); max-width: 600px; margin: 22px auto 0; text-shadow: 0 1px 22px rgba(0,0,0,0.5); opacity: 0; transform: translateY(14px); animation: heroUp 1s var(--ease) .35s forwards; }
  .hero-confirm .lead b { color: #fff; font-weight: 700; }
  @keyframes heroUp { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .hero-confirm h1, .hero-confirm .lead, .hero-confirm .video-frame { animation: none; opacity: 1; transform: none; } }
  @media (max-width: 720px) { .hero-confirm { justify-content: flex-start; min-height: 90vh; padding: 100px 0 64px; } }

  /* Welcome video frame (facade -> lazy Vimeo), sitting IN the hero over the blurred bg */
  .video-frame {
    position: relative; z-index: 2; max-width: 940px; width: 100%; margin: 42px auto 0; border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 16 / 9; background: #0c0e12; cursor: pointer;
    box-shadow: 0 0 0 3px #fff, 0 30px 74px -34px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(16px); animation: heroUp 1s var(--ease) .6s forwards;
  }
  .video-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; filter: brightness(1.08) saturate(1.06); }
  .video-frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,17,32,0) 54%, rgba(8,10,16,0.34) 100%); transition: opacity .25s; }
  .video-frame:hover::after { opacity: 0.9; }
  .video-frame .vf-play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
    width: 88px; height: 88px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 40px -10px rgba(var(--accent-rgb), 0.72);
    animation: ddBtnPulse 1.8s ease-in-out infinite;
  }
  .video-frame .vf-play::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.55); animation: ddRingPulse 1.8s cubic-bezier(0.25, 0.6, 0.3, 1) infinite; }
  .video-frame:hover .vf-play { background: var(--accent-bright); }
  .video-frame .vf-play svg { width: 30px; height: 30px; fill: #fff; margin-left: 4px; }
  @keyframes ddBtnPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.06); } }
  @keyframes ddRingPulse { 0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.5); } 70% { box-shadow: 0 0 0 30px rgba(var(--accent-rgb), 0); } 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); } }
  @media (prefers-reduced-motion: reduce) { .video-frame .vf-play, .video-frame .vf-play::after { animation: none; } }
  .video-frame .vf-chip {
    position: absolute; left: 18px; bottom: 18px; z-index: 2;
    font-weight: 800; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #fff;
    padding: 8px 13px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.7);
    background: rgba(10,14,24,0.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 5; }
  /* Once playing, drop the poster + custom controls so only the video shows (no bleed-through) */
  .video-frame.playing img,
  .video-frame.playing::after,
  .video-frame.playing .vf-play,
  .video-frame.playing .vf-chip { display: none; }
  .wv-cap { text-align: center; font-size: 13.5px; color: rgba(255,255,255,0.74); margin-top: 20px; letter-spacing: 0.02em; text-shadow: 0 1px 16px rgba(0,0,0,0.5); }
  @media (max-width: 720px) { .video-frame { margin-top: 28px; box-shadow: 0 0 0 2px #fff, 0 24px 56px -28px rgba(0,0,0,0.5); } .video-frame .vf-play { width: 68px; height: 68px; } .video-frame .vf-play svg { width: 24px; height: 24px; } }

  /* Hero scroll cue -> jumps to the Expiring Soon sessions */
  .hero-cue { display: inline-flex; flex-direction: column; align-items: center; gap: 10px; margin: 38px auto 0; text-decoration: none; text-align: center;
    opacity: 0; animation: heroUp 1s var(--ease) 1s forwards; }
  .hero-cue-text { font-weight: 800; font-size: 12px; letter-spacing: 0.13em; text-transform: uppercase; color: #fff; max-width: 340px; line-height: 1.5;
    text-shadow: 0 1px 2px rgba(0,0,0,0.75), 0 2px 16px rgba(0,0,0,0.62), 0 0 30px rgba(0,0,0,0.45); }
  .hero-cue-text b { color: #fff; font-weight: 800; }
  .hero-cue-arrow { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.85); background: rgba(10,8,12,0.42); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); box-shadow: 0 8px 22px -8px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; animation: cueBob 2s ease-in-out infinite; transition: border-color .2s, background .2s; }
  .hero-cue:hover .hero-cue-arrow { border-color: var(--accent-bright); background: rgba(var(--accent-rgb),0.55); }
  .hero-cue-arrow svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes cueBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .hero-cue { animation: none; opacity: 1; } .hero-cue-arrow { animation: none; } }
  @media (max-width: 720px) { .hero-cue { margin-top: 28px; } .hero-cue-text { font-size: 11px; } }

  /* ============ TESTIMONIALS PROOF LEAD (member avatars + rating, inside the head) ============ */
  .tw-proof { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 30px; }
  .tw-proof .proof-avatars { display: flex; align-items: center; }
  .tw-proof .proof-avatars img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; object-position: center 22%; border: 3px solid #fff; box-shadow: 0 6px 16px -6px rgba(20,23,28,0.45); margin-left: -15px; background: var(--mist); }
  .tw-proof .proof-avatars img:first-child { margin-left: 0; }
  .tw-proof .proof-stars { color: var(--gold); font-size: 16px; letter-spacing: 3px; line-height: 1; }
  .tw-proof .proof-line { font-size: 16.5px; line-height: 1.55; color: var(--muted); max-width: 540px; margin: 0; }
  .tw-proof .proof-line b { color: var(--ink); font-weight: 700; }
  @media (max-width: 480px) { .tw-proof .proof-avatars img { width: 46px; height: 46px; } }

  /* ============ WHAT HAPPENS NEXT (light, numbered timeline) ============ */
  .next { position: relative; overflow: hidden; padding: 124px 0; background: var(--mist); }
  .next .container { position: relative; z-index: 1; }
  .next-head { text-align: center; max-width: 820px; margin: 0 auto 66px; }
  .next-head .eyebrow { justify-content: center; }
  .next-head h2 { color: var(--ink); font-size: clamp(32px, 4.2vw, 60px); text-transform: uppercase; margin-top: 20px; text-wrap: balance; }
  .next-head h2 em { font-style: normal; color: var(--accent); }
  /* horizontal timeline: rail + scroll-drawn fill, giant milestone numbers, node dots */
  .steps { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(30px, 5vw, 64px); max-width: 1040px; margin: 0 auto; padding-top: 46px; }
  .steps-rail { position: absolute; top: 6px; left: 7%; right: 7%; height: 3px; border-radius: 3px; background: rgba(var(--accent-rgb),0.16); overflow: hidden; }
  .steps-rail::after { content: ""; position: absolute; inset: 0; width: 0; background: var(--accent); transition: width 1.4s var(--ease); }
  .steps.in .steps-rail::after { width: 100%; }
  .step { position: relative; text-align: center; }
  .step::before { content: ""; position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--mist); border: 3px solid rgba(var(--accent-rgb),0.3); z-index: 2; transition: border-color .4s ease, background .4s ease, box-shadow .4s ease; }
  .steps.in .step::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 6px rgba(var(--accent-rgb),0.14); }
  .steps.in .step:nth-child(3)::before { transition-delay: .45s; }
  .steps.in .step:nth-child(4)::before { transition-delay: .9s; }
  .step-num { font-weight: 900; font-size: clamp(80px, 9vw, 132px); line-height: 0.85; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; color: transparent; -webkit-text-stroke: 2px rgba(var(--accent-rgb), 0.5); }
  .step h3 { color: var(--ink); font-size: clamp(20px, 1.9vw, 26px); text-transform: uppercase; letter-spacing: -0.02em; margin: 16px 0 12px; }
  .step p { font-size: 15.5px; line-height: 1.62; color: var(--muted); max-width: 320px; margin: 0 auto; }
  .step p b { color: var(--ink); font-weight: 700; }
  @media (max-width: 900px) { .next { padding: 88px 0; } .steps { grid-template-columns: 1fr; gap: 46px; max-width: 400px; padding-top: 8px; } .steps-rail, .step::before { display: none; } }

  /* ============ WHITELIST / "AN APPLE A DAY" NOTE ============ */
  .whitelist-note {
    position: relative; max-width: 680px; margin: 76px auto 0; padding: 50px 44px 42px; border-radius: 16px;
    text-align: center; background: #fff; border: 1px solid var(--line);
    box-shadow: 0 30px 62px -30px rgba(20,23,28,0.42);
  }
  .whitelist-note .wn-badge {
    position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; font-weight: 800; font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: #fff; background: var(--accent); padding: 10px 22px; border-radius: 100px;
    box-shadow: 0 14px 28px -8px rgba(var(--accent-rgb),0.55); white-space: nowrap;
  }
  .whitelist-note h4 { font-size: clamp(22px, 2.4vw, 30px); font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); margin: 6px 0 16px; }
  .whitelist-note p { font-size: 15px; line-height: 1.62; color: var(--muted); max-width: 560px; margin: 0 auto; }
  .whitelist-note p + p { margin-top: 10px; }
  .whitelist-note b { color: var(--ink); font-weight: 700; }
  .whitelist-note .wn-help { margin-top: 24px; font-size: 13.5px; color: var(--soft); }
  .whitelist-note .wn-help a { color: var(--accent); font-weight: 700; text-decoration: none; border-bottom: 2px solid rgba(var(--accent-rgb),0.4); padding-bottom: 1px; transition: border-color .2s; }
  .whitelist-note .wn-help a:hover { border-bottom-color: var(--accent); }
  @media (max-width: 560px) { .whitelist-note { padding: 46px 24px 34px; } }

  /* ============ TESTIMONIALS - dark panels, member studio portraits ============ */
  .tw { background: var(--mist); padding: 128px 0; overflow: hidden; }
  .tw::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(var(--accent-rgb), 0.07), transparent 62%); }
  .tw .container { position: relative; z-index: 1; }
  .tw-head { text-align: center; max-width: 720px; margin: 0 auto 56px; }
  .tw-head .eyebrow { justify-content: center; }
  .tw-head h2 { color: var(--ink); font-size: clamp(34px, 4.4vw, 66px); text-transform: uppercase; margin-top: 22px; text-wrap: balance; }
  .tw-head h2 em { font-style: normal; color: var(--accent); }
  .tw-head p { color: var(--muted); font-size: clamp(16px, 1.3vw, 19px); line-height: 1.55; margin-top: 22px; }
  /* Staggered parallax member wall (3 columns, middle offset, gentle scroll parallax) */
  .pgallery { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 52px; }
  .pcol { display: flex; flex-direction: column; gap: 18px; will-change: transform; }
  @media (min-width: 861px) { .pgallery .pcol:nth-child(2) { margin-top: 48px; } .pgallery .pcol:nth-child(3) { margin-top: 18px; } }
  .ptile { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; background: var(--dark-2); border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 20px 46px -28px rgba(20,23,28,0.42); transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s; }
  .ptile img { width: 100%; height: 100%; object-fit: cover; object-position: center 14%; display: block; }
  .ptile::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(6,8,12,0) 38%, rgba(6,8,12,0.5) 64%, rgba(6,8,12,0.92) 100%); }
  .ptile:hover { transform: translateY(-5px); border-color: rgba(var(--accent-rgb),0.5); box-shadow: 0 34px 64px -30px rgba(var(--accent-rgb),0.42); }
  .ptile-chip { position: absolute; top: 12px; right: 12px; z-index: 2; font-weight: 800; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; padding: 5px 10px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.7); background: rgba(10,14,24,0.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .ptile-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 16px 18px 18px; }
  .ptile-stars { color: var(--gold); font-size: 12px; letter-spacing: 2.5px; line-height: 1; margin-bottom: 8px; }
  .ptile-quote { font-size: 15.5px; font-weight: 800; color: #fff; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 9px; }
  .ptile-name { font-weight: 800; font-size: 15px; color: #fff; line-height: 1.16; letter-spacing: 0.01em; }
  .ptile-name span { display: block; font-weight: 600; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #cbd2de; margin-top: 4px; }
  @media (max-width: 860px) {
    .tw { padding: 84px 0; }
    .pgallery { grid-template-columns: 1fr 1fr; gap: 14px; }
    .pcol { display: contents; }
    .pgallery .pcol { margin-top: 0; }
    /* Narrow tiles: move the text out of the photo overlay into a solid panel
       below, so the caption never covers the member's face. */
    .ptile { aspect-ratio: auto; display: flex; flex-direction: column; }
    .ptile img { aspect-ratio: 1 / 1; height: auto; }
    .ptile::after { display: none; }
    .ptile-info { position: static; background: #06080c; padding: 14px 14px 16px; }
  }

  /* ============ RECENT SESSIONS + 72-HOUR EXPIRY ============ */
  .sessions { background: var(--paper); padding: 120px 0; }
  .ep-head { text-align: center; max-width: 760px; margin: 0 auto; }
  .ep-head .eyebrow { justify-content: center; }
  .ep-head h2 { font-size: clamp(32px, 4vw, 58px); text-transform: uppercase; margin-top: 20px; text-wrap: balance; }
  .ep-head h2 em { font-style: normal; color: var(--accent); }
  .ep-expiry { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 11px 20px; border-radius: 100px;
    background: rgba(var(--accent-rgb), 0.07); border: 1px solid rgba(var(--accent-rgb), 0.28); color: var(--accent);
    font-weight: 700; font-size: 13.5px; letter-spacing: 0.01em; }
  .ep-expiry svg { width: 16px; height: 16px; stroke: var(--accent); stroke-width: 2; fill: none; flex-shrink: 0; }
  .ep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin: 54px auto 0; max-width: 1040px; }
  /* Each card is a self-contained designed graphic (title + PLAY NOW baked in). No overlays. */
  .ep-card { position: relative; display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 12px 36px -16px rgba(20,23,28,0.32); transition: transform .28s var(--ease), box-shadow .28s var(--ease); }
  .ep-card:hover { transform: translateY(-6px); box-shadow: 0 40px 70px -30px rgba(20,23,28,0.48); }
  .ep-card img { display: block; width: 100%; height: auto; }
  /* Date (top-left, over the photo) + runtime (top-right, over the red panel) overlays */
  .ep-metarow { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 8px; }
  .ep-meta { display: inline-flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: #fff;
    background: rgba(10,8,10,0.5); border: 1px solid rgba(255,255,255,0.22); border-radius: 100px;
    padding: 6px 12px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  .ep-meta svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 2; fill: none; }
  @media (max-width: 760px) { .sessions { padding: 84px 0; } .ep-grid { grid-template-columns: 1fr; max-width: 480px; } }

  /* ============ CLOSE (dark maroon) ============ */
  .close-band { color: #fff; padding: 116px 0; text-align: center; overflow: hidden;
    background: radial-gradient(ellipse 70% 55% at 50% 0%, rgba(var(--accent-rgb), 0.30), transparent 62%), linear-gradient(160deg, var(--dark) 0%, var(--dark-2) 100%); }
  .close-band .container { position: relative; z-index: 1; }
  .close-band .eyebrow { justify-content: center; }
  .close-band h2 { color: #fff; font-size: clamp(40px, 6vw, 90px); text-transform: uppercase; margin: 20px 0 0; text-wrap: balance; }
  .close-band h2 em { font-style: normal; color: var(--accent-bright); }
  .close-band p { font-size: clamp(16px, 1.4vw, 20px); line-height: 1.6; color: var(--mist-on-dark); max-width: 600px; margin: 26px auto 0; }
  .close-band p b { color: #fff; }
  .close-actions { display: flex; align-items: center; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 40px; }
  @media (max-width: 720px) { .close-band { padding: 84px 0; } }

  /* ============ SHARE TOAST ============ */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 14px 22px; border-radius: var(--radius);
    font-weight: 700; font-size: 13px; letter-spacing: 0.03em;
    box-shadow: 0 18px 40px -14px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity .25s var(--ease), transform .25s var(--ease); z-index: 300;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ EXIT-INTENT "LATEST SESSION" POPUP ============ */
  .xp-modal { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(6,6,6,0.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden; transition: opacity .28s var(--ease), visibility .28s var(--ease); }
  .xp-modal.open { opacity: 1; visibility: visible; }
  .xp-card { position: relative; width: 100%; max-width: 460px; background: #fff; border-radius: 0; padding: 38px 34px 30px;
    box-shadow: 0 40px 100px -28px rgba(0,0,0,0.55); transform: translateY(16px); transition: transform .3s var(--ease);
    max-height: calc(100vh - 48px); overflow-y: auto; text-align: left; }
  .xp-modal.open .xp-card { transform: none; }
  .xp-close { position: absolute; top: 16px; right: 16px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; color: var(--soft); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, color .2s; }
  .xp-close:hover { background: var(--mist); color: var(--ink); }
  .xp-close svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; }
  .xp-accent { display: block; width: 52px; height: 3px; background: var(--accent); border-radius: 2px; margin-bottom: 15px; }
  .xp-eyebrow { font-weight: 800; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  .xp-title { font-weight: 900; letter-spacing: -0.03em; line-height: 1.04; font-size: clamp(23px, 3vw, 29px); text-transform: uppercase; color: var(--ink); }
  .xp-title em { font-style: normal; color: var(--accent); }
  .xp-sub { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 12px 0 20px; }
  .xp-list { display: block; }
  .xp-session { position: relative; display: block; border-radius: 0; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 12px 30px -16px rgba(20,23,28,0.32); transition: transform .25s var(--ease), box-shadow .25s var(--ease); text-decoration: none; }
  .xp-session[hidden] { display: none; }
  .xp-session:hover { transform: translateY(-4px); box-shadow: 0 26px 50px -24px rgba(20,23,28,0.46); }
  .xp-session img { display: block; width: 100%; height: auto; }
  .xp-session-date { position: absolute; top: 10px; right: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: #fff;
    background: rgba(10,8,10,0.5); border: 1px solid rgba(255,255,255,0.22); border-radius: 100px; padding: 6px 12px;
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  @media (max-width: 520px) { .xp-card { padding: 34px 22px 26px; } }

  /* ============ FOOTER ============ */
  footer { background: #0a0a0a; color: #c3bbb9; padding: 70px 0 40px; }
  .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1.2fr; gap: 40px; }
  .foot-brand .fb-logo { height: 46px; width: auto; display: block; }
  .foot-brand .tag { font-size: 14px; line-height: 1.6; color: #fff; margin-top: 20px; max-width: 320px; }
  .socials { display: flex; gap: 12px; margin-top: 22px; }
  .socials a { width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.16); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s; }
  .socials a:hover { background: var(--accent); border-color: var(--accent); }
  .socials svg { width: 15px; height: 15px; fill: #c3bbb9; }
  .socials a:hover svg { fill: #fff; }
  .footer-col h3 { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: #988f8d; font-weight: 600; margin-bottom: 24px; }
  .footer-col ul { list-style: none; }
  .footer-col li { margin-bottom: 14px; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
  .footer-col a { color: #c3bbb9; text-decoration: none; transition: color .18s; }
  .footer-col a:hover { color: #fff; }
  .bmc-corner { display: flex; align-items: flex-start; gap: 16px; color: #a89f9d; text-decoration: none; transition: color .2s; }
  .bmc-corner:hover { color: #fff; }
  .bmc-corner img { width: 52px; height: 52px; display: block; filter: brightness(0) invert(1) opacity(0.85); transition: opacity .2s; flex-shrink: 0; margin-top: 2px; }
  .bmc-corner:hover img { filter: brightness(0) invert(1) opacity(1); }
  .bmc-corner-text { display: flex; flex-direction: column; gap: 8px; }
  .bmc-corner-title { font-weight: 700; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #a89f9d; line-height: 1; }
  .bmc-corner-tag { font-weight: 700; font-size: 14px; letter-spacing: 0.02em; text-transform: uppercase; color: #fff; line-height: 1.2; }
  .bmc-corner-cta { font-weight: 500; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #a89f9d; display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; transition: color .2s; }
  .bmc-corner:hover .bmc-corner-cta { color: #fff; }
  .footer-bottom { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 52px; padding-top: 26px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 10px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; color: #867d7b; }
  .footer-bottom .legal-links { display: flex; gap: 24px; }
  .footer-bottom a { color: #867d7b; text-decoration: none; }
  .footer-bottom a:hover { color: #c3bbb9; }
  @media (max-width: 860px) { .footer-grid { grid-template-columns: 1fr 1fr; gap: 34px; } .foot-brand { grid-column: 1 / -1; } }
  @media (max-width: 520px) { .footer-grid { grid-template-columns: 1fr; } }

<div id="dd-app"></div>
<script>
/* --- inlined dd-welcome-v8.js (our last version, pre Aug-5 team edits) --- */
document.getElementById("dd-app").innerHTML="<!-- ============ NAV ============ -->\n<nav class=\"top\">\n  <a class=\"nav-brand\" href=\"/\">\n    <img class=\"logo-white\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e37bd7033981c3c54ca8_dd-logo-white.png\" alt=\"DarrenDaily, Daily Mentoring with Darren Hardy\" width=\"534\" height=\"120\">\n    <img class=\"logo-color\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55222bf946a016bb03d_dd-logo-color.webp\" alt=\"DarrenDaily, Daily Mentoring with Darren Hardy\" width=\"268\" height=\"63\">\n  </a>\n  <button class=\"nav-cta\" type=\"button\" data-share>Share DarrenDaily <span class=\"arrow\">&rarr;</span></button>\n</nav>\n\n<main id=\"top\">\n\n<!-- ============ HERO: full-bleed garden chair, \"your seat is set\" ============ -->\n<section class=\"hero-confirm\">\n  <img class=\"hero-bg\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55270b11505bd250f68_hero-chair.webp\" alt=\"The DarrenDaily garden set: an open chair, an orchid, and a DarrenDaily mug in the morning light\" width=\"2200\" height=\"1229\" fetchpriority=\"high\">\n  <div class=\"container\">\n    <h1>You're in<span class=\"dot\">.</span></h1>\n    <p class=\"lead\"><b>Your seat is set.</b> Take a minute. Watch this. Then do the one thing that makes sure every mentor session reaches you.</p>\n\n    <!-- Facade: poster + play button. Clicking mounts the Vimeo iframe (zero bytes until then). -->\n    <div class=\"video-frame\" id=\"welcomeVideo\" data-vimeo-id=\"298901870\" role=\"button\" tabindex=\"0\" aria-label=\"Play Darren's welcome message\">\n      <img src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e552daf5e386ed5dd8d1_dh-waving.webp\" srcset=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55270b11505bd250f80_dh-waving-m.webp 820w, https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e552daf5e386ed5dd8d1_dh-waving.webp 1600w\" sizes=\"(max-width: 980px) 100vw, 940px\" alt=\"Darren Hardy waving hello on the DarrenDaily garden set\" width=\"1600\" height=\"893\">\n      <span class=\"vf-chip\">Watch &middot; 90 seconds</span>\n      <span class=\"vf-play\" aria-hidden=\"true\">\n        <svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/></svg>\n      </span>\n    </div>\n    <a class=\"hero-cue\" href=\"#sessions\" aria-label=\"Bonus: Watch the latest sessions now before they expire\">\n      <span class=\"hero-cue-text\"><b>Bonus:</b> Watch the latest sessions now before they expire.</span>\n      <span class=\"hero-cue-arrow\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"/></svg></span>\n    </a>\n  </div>\n</section>\n\n<!-- ============ WHAT HAPPENS NEXT ============ -->\n<section class=\"next\">\n  <div class=\"container\">\n    <div class=\"next-head reveal\">\n      <div class=\"eyebrow center\"><span class=\"pip\"></span>What Happens Next</div>\n      <h2>Three simple steps to <em>#BetterEveryDay</em></h2>\n    </div>\n    <div class=\"steps stagger\">\n      <span class=\"steps-rail\" aria-hidden=\"true\"></span>\n      <div class=\"step\">\n        <div class=\"step-num\">01</div>\n        <h3>Coming in HOT</h3>\n        <p><b>Your first mentor session arrives within 24-48 hours.</b> After that. Five minutes every weekday morning. 260 mornings a year. No ads. Ever.</p>\n      </div>\n      <div class=\"step\">\n        <div class=\"step-num\">02</div>\n        <h3>Prep your inbox</h3>\n        <p><b>New senders get buried.</b> Move this one to your inbox now so a session never slips into spam or promotions. The steps are just below.</p>\n      </div>\n      <div class=\"step\">\n        <div class=\"step-num\">03</div>\n        <h3>Show up Every Day</h3>\n        <p><b>Open it. Sit with the idea for a beat</b> before the day takes over. Then carry it into one real decision. That small habit is where #BetterEveryDay begins.</p>\n      </div>\n    </div>\n\n    <!-- Whitelist detail (\"an apple a day\" note pattern) -->\n    <div class=\"whitelist-note reveal\">\n      <span class=\"wn-badge\">#NeverMiss</span>\n      <h4>Add Darren to your inbox</h4>\n      <p>Add <b>darrendaily@darrenhardy.com</b> to your contacts. Gmail buries new senders in Promotions. Drag the first email into <b>Primary</b>. Using Apple Mail or Outlook? Mark the sender as a <b>known contact</b>.</p>\n      <p>Nothing after a day? Check Spam or Junk. Mark it Not spam. That is all it takes.</p>\n      <p class=\"wn-help\">Still stuck? <a href=\"https://helpme.darrenhardy.com/hc/en-us\" target=\"_blank\" rel=\"noopener\">Visit the help center</a></p>\n    </div>\n  </div>\n</section>\n\n<!-- ============ RECENT SESSIONS + 72-HOUR EXPIRY ============ -->\n<!-- WEBFLOW: bind .ep-grid to a Collection List on the Sessions CMS.\n     Sort by Publish date (descending), Limit 2 -> always the two latest.\n     Each card is a self-contained designed graphic (title + PLAY NOW baked in):\n       .ep-card img       -> session \"card image\" field (set alt text = session title)\n       .ep-card href      -> session slug / post page\n       .ep-meta--date     -> Publish date field\n     Cards below are the two real latest sessions (Resilience Jul 23, Saturdays Jul 24 2026). -->\n<section class=\"sessions\" id=\"sessions\">\n  <div class=\"container\">\n    <div class=\"ep-head reveal\">\n      <div class=\"eyebrow accent center\"><span class=\"pip\"></span>Expiring Soon</div>\n      <h2>Start with the <em>latest</em>.</h2>\n      <div class=\"ep-expiry\">\n        <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><polyline points=\"12 7 12 12 15.5 14\"/></svg>\n        Each session lives 72 hours. Then it is gone.\n      </div>\n    </div>\n    <div class=\"ep-grid stagger\">\n      <a class=\"ep-card\" href=\"https://dd.darrenhardy.com/inspiring-real-life-story-for-career-resilience\">\n        <img sr     var bottomTick = false;
    window.addEventListener('scroll', function () {
      if (bottomTick) return; bottomTick = true;
      requestAnimationFrame(function () {
        bottomTick = false;
        if (window.pageYOffset + window.innerHeight >= document.documentElement.scrollHeight - 40) {
          reachedBottom = true;
          open(false);
        }
      });
    }, { passive: true });
    // Idle: no touch/scroll/tap/keypress for 30s -> about to drift off.
    var idleTimer;
    function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(function () { open(false); }, 45000); }
    ['touchstart', 'scroll', 'click', 'keydown', 'mousemove'].forEach(function (evt) {
      window.addEventListener(evt, resetIdle, { passive: true });
    });
    resetIdle();
    pop.querySelectorAll('[data-xp-close]').forEach(function (el) { el.addEventListener('click', close); });
    pop.addEventListener('click', function (e) { if (e.target === pop) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pop.classList.contains('open')) close(); });
    if (/[?&]exit=1/.test(location.search)) open(true);   // QA: append ?exit=1 to force-preview
  })();

</script>
