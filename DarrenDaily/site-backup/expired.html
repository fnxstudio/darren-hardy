<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Expired · DarrenDaily</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* --- inlined dd-expired.css (our last version) --- */
@font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url(https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55322bf946a016bb09a_inter-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url(https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55322bf946a016bb0af_inter-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    /* Neutrals */
    --paper:         #ffffff;
    --mist:          #f3f5f8;
    --ink:           #14171c;
    --muted:         #545c68;
    --soft:          #616a78;
    --line:          rgba(20, 23, 28, 0.12);
    --line-soft:     rgba(20, 23, 28, 0.07);
    /* Brand accent (DarrenDaily red) */
    --accent:        #a72632;
    --accent-deep:   #812a37;
    --accent-bright: #cf3a45;
    --accent-rgb:    167, 38, 50;
    /* Dark bands / footer (deep maroon) */
    --dark:          #2a1015;
    --dark-2:        #1c0a0e;
    --mist-on-dark:  #e7d4d6;
    /* Tokens */
    --gold:          #ffce3a;
    --radius:        4px;
    --ease:          cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body {
    background: var(--paper); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400; -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility; overflow-x: hidden;
  }
  a { color: inherit; }
  img { max-width: 100%; }

  /* ============ SHARED ============ */
  section { position: relative; scroll-margin-top: 96px; }
  .container { max-width: 1320px; margin: 0 auto; padding: 0 48px; }
  @media (max-width: 720px) { .container { padding: 0 22px; } }

  .eyebrow {
    font-weight: 700; font-size: 12px; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--soft);
    display: inline-flex; align-items: center; gap: 16px;
  }
  .eyebrow .pip { width: 34px; height: 3px; background: var(--accent); display: inline-block; }
  .eyebrow.accent { color: var(--accent); }
  .eyebrow.on-dark { color: rgba(255,255,255,0.82); }
  .eyebrow.on-dark .pip { background: var(--accent-bright); }
  .eyebrow.center { justify-content: center; }

  h1, h2, h3 { font-weight: 900; letter-spacing: -0.03em; line-height: 1.0; }
  em.key  { font-style: normal; color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; gap: 12px;
    font-weight: 800; font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 20px 38px; border-radius: var(--radius); text-decoration: none; cursor: pointer;
    background: var(--accent); color: #fff; border: 2px solid var(--accent);
    transition: background .2s var(--ease), color .2s, transform .2s, box-shadow .2s;
    box-shadow: 0 14px 30px -12px rgba(var(--accent-rgb), 0.5);
    position: relative; overflow: hidden;
  }
  .btn:hover { background: #fff; color: var(--accent); transform: translateY(-2px); box-shadow: 0 18px 36px -14px rgba(var(--accent-rgb), 0.4); }
  .btn.ondark { background: var(--accent-bright); border-color: var(--accent-bright); }
  .btn.ondark:hover { background: #fff; color: var(--accent); border-color: #fff; box-shadow: 0 18px 36px -14px rgba(0,0,0,0.5); }
  .btn .arrow { transition: transform .2s var(--ease); }
  .btn:hover .arrow { transform: translateX(5px); }

  .btn-line {
    display: inline-flex; align-items: center; gap: 9px;
    font-weight: 700; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;
    text-decoration: none; color: var(--ink); cursor: pointer;
    border-bottom: 2px solid var(--accent); padding-bottom: 4px; transition: color .2s;
  }
  .btn-line:hover { color: var(--accent); }
  .btn-line.ondark { color: #fff; border-bottom-color: var(--accent-bright); }
  .btn-line.ondark:hover { color: var(--accent-bright); }
  .btn-line .arrow { transition: transform .2s var(--ease); }
  .btn-line:hover .arrow { transform: translateX(4px); }

  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }
  .stagger > * { opacity: 0; transform: translateY(26px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .stagger.in > * { opacity: 1; transform: none; }
  .stagger.in > *:nth-child(2) { transition-delay: .10s; }
  .stagger.in > *:nth-child(3) { transition-delay: .20s; }
  @media (prefers-reduced-motion: reduce) { .reveal, .stagger > * { opacity: 1 !important; transform: none !important; } }

  /* ============ NAV (solid, ink logo) ============ */
  nav.top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 60;
    display: flex; align-items: center; justify-content: space-between; padding: 20px 40px;
    background: transparent; transition: background .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease), padding .3s var(--ease);
    border-bottom: 1px solid transparent;
  }
  nav.top.solid {
    position: fixed; padding: 14px 40px; background: #fff;
    border-bottom: 1px solid var(--line); box-shadow: 0 6px 24px -14px rgba(20, 23, 28, 0.35);
  }
  .nav-brand { display: flex; align-items: center; text-decoration: none; white-space: nowrap; line-height: 1; }
  .nav-brand img { height: 34px; width: auto; display: block; }
  /* White logo over the photo hero, full-color logo once the bar goes solid */
  .nav-brand .logo-white { display: block; }
  .nav-brand .logo-color { display: none; }
  nav.top.solid .nav-brand .logo-white { display: none; }
  nav.top.solid .nav-brand .logo-color { display: block; }
  /* Shared nav action: red pill, fades in once the nav goes solid (matches darrendaily.html) */
  .nav-cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff !important; padding: 11px 20px; border-radius: var(--radius);
    font-weight: 700; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none;
    border: 2px solid var(--accent); font-family: inherit; cursor: pointer; -webkit-appearance: none; appearance: none;
    transition: background .2s, color .2s, opacity .35s var(--ease), transform .35s var(--ease);
    opacity: 0; transform: translateY(-6px); pointer-events: none;
  }
  nav.top.solid .nav-cta { opacity: 1; transform: none; pointer-events: auto; }
  .nav-cta:hover { background: transparent; color: var(--accent) !important; }
  .nav-cta:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 4px; }
  .nav-cta .arrow { transition: transform .2s var(--ease); }
  .nav-cta:hover .arrow { transform: translateX(4px); }
  @media (max-width: 720px) { nav.top { padding: 12px 22px; } nav.top.solid { padding: 12px 22px; } .nav-brand img { height: 30px; } .nav-cta { padding: 10px 16px; font-size: 10px; } }

  /* ============ HERO (immersive - blurred garden-chair bg, video IN the hero) ============ */
  .hero-confirm { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 0 84px; text-align: center; overflow: hidden; background: var(--mist); }
  .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; filter: blur(20px) brightness(1.02) saturate(1.14); transform: scale(1.16); z-index: 0; }
  .hero-confirm::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 76% 48% at 50% 32%, rgba(20,10,12,0.32), transparent 70%),
      linear-gradient(180deg, rgba(20,10,12,0.28) 0%, rgba(20,10,12,0.03) 24%, rgba(20,10,12,0.02) 56%, rgba(20,10,12,0.30) 100%);
  }
  .hero-confirm .container { position: relative; z-index: 2; width: 100%; max-width: 1720px; }
  .hero-confirm .h-eyebrow {
    display: inline-flex; align-items: center; gap: 12px; margin-bottom: 22px;
    font-weight: 800; font-size: 11.5px; letter-spacing: 0.28em; text-transform: uppercase; color: #fff;
    padding: 9px 18px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.4);
    background: rgba(10,8,12,0.32); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    text-shadow: 0 1px 14px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(14px); animation: heroUp 1s var(--ease) 0s forwards;
  }
  .hero-confirm .h-eyebrow .dotpip { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-bright); box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0.6); animation: ddDotPulse 1.8s ease-in-out infinite; }
  @keyframes ddDotPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0.55); } 70% { box-shadow: 0 0 0 9px rgba(var(--accent-rgb),0); } }
  .hero-confirm h1 { color: #fff; font-size: clamp(44px, 6.6vw, 100px); text-transform: uppercase; margin: 0; text-wrap: balance; text-shadow: 0 2px 44px rgba(0,0,0,0.45); opacity: 0; transform: translateY(14px); animation: heroUp 1s var(--ease) .1s forwards; }
  .hero-confirm h1 em { font-style: normal; color: var(--accent-bright); }
  .hero-confirm h1 .dot { color: var(--accent-bright); }
  .hero-confirm .lead { font-size: clamp(17px, 1.5vw, 21px); line-height: 1.6; color: rgba(255,255,255,0.94); max-width: 780px; margin: 22px auto 0; text-shadow: 0 1px 22px rgba(0,0,0,0.5); opacity: 0; transform: translateY(14px); animation: heroUp 1s var(--ease) .35s forwards; }
  .hero-confirm .lead b { color: #fff; font-weight: 700; }
  @keyframes heroUp { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .hero-confirm .h-eyebrow, .hero-confirm .h-eyebrow .dotpip, .hero-confirm h1, .hero-confirm .lead, .hero-confirm .video-frame { animation: none; opacity: 1; transform: none; } }
  @media (max-width: 720px) { .hero-confirm { justify-content: flex-start; padding: 86px 0 68px; } }

  /* "Why it expires" video frame (facade -> lazy Vimeo), sitting IN the hero over the blurred bg */
  .video-frame {
    position: relative; z-index: 2; max-width: 940px; width: 100%; margin: 42px auto 0; border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 16 / 9; background: #0c0e12; cursor: pointer;
    box-shadow: 0 0 0 3px #fff, 0 30px 74px -34px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(16px); animation: heroUp 1s var(--ease) .6s forwards;
  }
  .video-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; filter: brightness(1.08) saturate(1.06); }
  .video-frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,17,32,0) 54%, rgba(8,10,16,0.34) 100%); transition: opacity .25s; }
  .video-frame:hover::after { opacity: 0.9; }
  .video-frame .vf-play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
    width: 88px; height: 88px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 40px -10px rgba(var(--accent-rgb), 0.72);
    animation: ddBtnPulse 1.8s ease-in-out infinite;
  }
  .video-frame .vf-play::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.55); animation: ddRingPulse 1.8s cubic-bezier(0.25, 0.6, 0.3, 1) infinite; }
  .video-frame:hover .vf-play { background: var(--accent-bright); }
  .video-frame .vf-play svg { width: 30px; height: 30px; fill: #fff; margin-left: 4px; }
  @keyframes ddBtnPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.06); } }
  @keyframes ddRingPulse { 0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.5); } 70% { box-shadow: 0 0 0 30px rgba(var(--accent-rgb), 0); } 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); } }
  @media (prefers-reduced-motion: reduce) { .video-frame .vf-play, .video-frame .vf-play::after { animation: none; } }
  .video-frame .vf-chip {
    position: absolute; left: 18px; bottom: 18px; z-index: 2;
    font-weight: 800; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #fff;
    padding: 8px 13px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.7);
    background: rgba(10,14,24,0.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 5; }
  /* Once playing, drop the poster + custom controls so only the video shows (no bleed-through) */
  .video-frame.playing img,
  .video-frame.playing::after,
  .video-frame.playing .vf-play,
  .video-frame.playing .vf-chip { display: none; }
  @media (max-width: 720px) { .video-frame { margin-top: 28px; box-shadow: 0 0 0 2px #fff, 0 24px 56px -28px rgba(0,0,0,0.5); } .video-frame .vf-play { width: 68px; height: 68px; } .video-frame .vf-play svg { width: 24px; height: 24px; } }

  /* Hero scroll cue -> jumps to the live sessions */
  .hero-cue { display: inline-flex; flex-direction: column; align-items: center; gap: 10px; margin: 38px auto 0; text-decoration: none; text-align: center;
    opacity: 0; animation: heroUp 1s var(--ease) 1s forwards; }
  .hero-cue-text { font-weight: 800; font-size: 12px; letter-spacing: 0.13em; text-transform: uppercase; color: #fff; max-width: 360px; line-height: 1.5;
    text-shadow: 0 1px 2px rgba(0,0,0,0.75), 0 2px 16px rgba(0,0,0,0.62), 0 0 30px rgba(0,0,0,0.45); }
  .hero-cue-text b { color: #fff; font-weight: 800; }
  .hero-cue-arrow { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.85); background: rgba(10,8,12,0.42); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); box-shadow: 0 8px 22px -8px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; animation: cueBob 2s ease-in-out infinite; transition: border-color .2s, background .2s; }
  .hero-cue:hover .hero-cue-arrow { border-color: var(--accent-bright); background: rgba(var(--accent-rgb),0.55); }
  .hero-cue-arrow svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes cueBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .hero-cue { animation: none; opacity: 1; } .hero-cue-arrow { animation: none; } }
  @media (max-width: 720px) { .hero-cue { margin-top: 28px; } .hero-cue-text { font-size: 11px; } }

  /* ============ MANIFESTO QUOTE (full-bleed mist grey, darrenhardy.com new-build style) ============ */
  .manifesto { background: var(--mist); color: var(--ink); padding: clamp(104px, 15vh, 190px) 0; text-align: center; overflow: hidden; border-bottom: 1px solid var(--line-soft); }
  .manifesto .container { max-width: 1040px; }
  .manifesto blockquote { font-weight: 900; text-transform: uppercase; font-size: clamp(30px, 4.4vw, 64px); line-height: 0.98; letter-spacing: -0.03em; color: var(--ink); text-wrap: balance; margin: 0; }
  .manifesto blockquote em { font-style: normal; color: var(--accent); }
  .manifesto cite { display: block; margin-top: clamp(30px, 4.5vw, 52px); font-style: normal; font-weight: 700; font-size: clamp(11px, 0.95vw, 13.5px); letter-spacing: 0.42em; text-transform: uppercase; color: var(--soft); }

  /* ============ RECENT SESSIONS + 72-HOUR EXPIRY ============ */
  .sessions { background: var(--paper); padding: 120px 0; }
  .ep-head { text-align: center; max-width: 780px; margin: 0 auto; }
  .ep-head .eyebrow { justify-content: center; }
  .ep-head h2 { font-size: clamp(32px, 4vw, 58px); text-transform: uppercase; margin-top: 20px; text-wrap: balance; }
  .ep-head h2 em { font-style: normal; color: var(--accent); }
  .ep-head .ep-lead { font-size: clamp(16px, 1.3vw, 18.5px); line-height: 1.6; color: var(--muted); max-width: 620px; margin: 22px auto 0; }
  .ep-head .ep-lead b { color: var(--ink); font-weight: 700; }
  .ep-expiry { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 11px 20px; border-radius: 100px;
    background: rgba(var(--accent-rgb), 0.07); border: 1px solid rgba(var(--accent-rgb), 0.28); color: var(--accent);
    font-weight: 700; font-size: 13.5px; letter-spacing: 0.01em; }
  .ep-expiry svg { width: 16px; height: 16px; stroke: var(--accent); stroke-width: 2; fill: none; flex-shrink: 0; }
  .ep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin: 54px auto 0; max-width: 1040px; }
  /* Each card is a self-contained designed graphic (title + PLAY NOW baked in). No overlays. */
  .ep-card { position: relative; display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 12px 36px -16px rgba(20,23,28,0.32); transition: transform .28s var(--ease), box-shadow .28s var(--ease); }
  .ep-card:hover { transform: translateY(-6px); box-shadow: 0 40px 70px -30px rgba(20,23,28,0.48); }
  .ep-card img { display: block; width: 100%; height: auto; }
  /* Date (top-left, over the photo) + runtime (top-right, over the red panel) overlays */
  .ep-metarow { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 8px; }
  .ep-meta { display: inline-flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: #fff;
    background: rgba(10,8,10,0.5); border: 1px solid rgba(255,255,255,0.22); border-radius: 100px;
    padding: 6px 12px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  .ep-meta svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 2; fill: none; }
  @media (max-width: 760px) { .sessions { padding: 84px 0; } .ep-grid { grid-template-columns: 1fr; max-width: 480px; } }

  /* ============ WHAT TO DO INSTEAD (dark maroon close band) ============ */
  .close-band { color: #fff; padding: 116px 0; text-align: center; overflow: hidden;
    background: radial-gradient(ellipse 70% 55% at 50% 0%, rgba(var(--accent-rgb), 0.30), transparent 62%), linear-gradient(160deg, var(--dark) 0%, var(--dark-2) 100%); }
  .close-band .container { position: relative; z-index: 1; }
  .close-band .eyebrow { justify-content: center; }
  .close-band h2 { color: #fff; font-size: clamp(36px, 5.2vw, 74px); text-transform: uppercase; margin: 20px 0 0; text-wrap: balance; }
  .close-band h2 em { font-style: normal; color: var(--accent-bright); }
  .close-band p.cb-sub { font-size: clamp(16px, 1.4vw, 20px); line-height: 1.6; color: var(--mist-on-dark); max-width: 620px; margin: 26px auto 0; }
  .close-band p.cb-sub b { color: #fff; }
  .close-actions { display: flex; align-items: center; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 40px; }
  .cb-help { margin-top: 34px; font-size: 13.5px; color: rgba(255,255,255,0.72); }
  .cb-help a { color: #fff; font-weight: 700; text-decoration: none; border-bottom: 2px solid rgba(255,255,255,0.4); padding-bottom: 1px; transition: border-color .2s; }
  .cb-help a:hover { border-bottom-color: #fff; }
  @media (max-width: 720px) { .close-band { padding: 84px 0; } }

  /* ============ MEDIA COVER BIO - "The Vantage": SUCCESS covers wall + Darren cutout ============ */
  .intro { display: flex; min-height: 60vh; }
  .intro-wall { flex: 1; position: relative; overflow: hidden; background: #0a0a0a; }
  .intro-text { width: 42%; min-width: 300px; background: var(--mist); color: var(--ink); display: flex; flex-direction: column; justify-content: center; padding: 64px 54px; }
  @media (max-width: 900px) { .intro { flex-direction: column; } .intro-wall { flex: none; min-height: 66vh; } .intro-text { width: 100%; padding: 56px 30px; } }
  #covers-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 150px; grid-auto-flow: dense; gap: 2px; will-change: transform; }
  .c-tile { position: relative; overflow: hidden; background: #0d0d0d; opacity: 0; transform: scale(0.93) translateY(14px); will-change: opacity, transform; cursor: pointer; }
  .c-tile.visible { opacity: 1; transform: scale(1) translateY(0); transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1); }
  .c-wide  { grid-column: span 2; }
  .c-tall  { grid-row:    span 2; }
  .c-large { grid-column: span 2; grid-row: span 2; }

site-files.com/6a66d7a6f9d116b514a13ae1/6a66e5524df7439ce7c712d7_Wall-DH-blue2.webp\" width=\"1400\" height=\"782\" alt=\"Darren Hardy in front of the wall of SUCCESS magazine covers he published\" loading=\"lazy\">\n    </div>\n  </div>\n  <div class=\"intro-text\">\n    <div class=\"eyebrow accent\"><span class=\"pip\"></span>The Vantage</div>\n    <h2 class=\"intro-headline\">Behind the covers. Behind <em>closed doors.</em></h2>\n    <div class=\"intro-body\">\n      <p><b>For 35 years, Darren sat at the centerpiece of the success media industry.</b> Founding publisher of SUCCESS magazine. Executive producer of three success-focused television networks.</p>\n      <p>Nearly every iconic founder and self-made billionaire who built something extraordinary from nothing took his call. They opened their vault doors. Not the PR version.</p>\n      <p>He didn't read about the people on these covers. He put them there.</p>\n      <p>That is the vantage behind every DarrenDaily. Every weekday morning, he hands you a piece of it. One clear idea, five minutes, before the world gets loud.</p>\n    </div>\n    <div class=\"intro-stats\">\n      <div><div class=\"is-n\">35 yrs</div><div class=\"is-l\">At the center of success</div></div>\n      <div><div class=\"is-n\">11,000+</div><div class=\"is-l\">Businesses tested</div></div>\n      <div><div class=\"is-n\">SUCCESS</div><div class=\"is-l\">Founding publisher</div></div>\n      <div><div class=\"is-n\">SUCCESS TV</div><div class=\"is-l\">Executive producer</div></div>\n    </div>\n    <div class=\"seals\" aria-label=\"Awards and bestseller recognition\">\n      <img class=\"seal\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55414427c7ab00951ec_seal-dd.webp\" width=\"374\" height=\"220\" alt=\"Award-Winning, Top 10 Personal Development Blog, DarrenDaily\" loading=\"lazy\">\n      <img class=\"seal\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55457b738a7a03842dc_seal-amazon.webp\" width=\"385\" height=\"220\" alt=\"Amazon, 21,177 Five-Star Customer Reviews\" loading=\"lazy\">\n      <img class=\"seal\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e5543eefd66b6dc2c690_seal-nsa.webp\" width=\"365\" height=\"220\" alt=\"Award-Winning, Master of Influence, NSA of America\" loading=\"lazy\">\n      <img class=\"seal\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55457b738a7a03842f1_seal-nyt.webp\" width=\"220\" height=\"220\" alt=\"New York Times Best Seller\" loading=\"lazy\">\n      <img class=\"seal\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55457b738a7a0384306_seal-ddod.webp\" width=\"346\" height=\"220\" alt=\"Award-Winning, Top Rated Apple Podcast, DarrenDaily On Demand\" loading=\"lazy\">\n      <img class=\"seal\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e55522bf946a016bb0ec_seal-wsj.webp\" width=\"243\" height=\"220\" alt=\"Wall Street Journal Bestseller\" loading=\"lazy\">\n    </div>\n  </div>\n</section>\n\n<!-- ============ FOOTER ============ -->\n<footer>\n  <div class=\"container\">\n    <div class=\"footer-grid\">\n      <div class=\"foot-brand\">\n        <img class=\"fb-logo\" src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e37bd7033981c3c54ca8_dd-logo-white.png\" alt=\"DarrenDaily, Daily Mentoring with Darren Hardy\" width=\"534\" height=\"120\">\n        <p class=\"tag\">Five days a week, 260 days a year, one strategic idea to start the day. No ads, no sponsors. Your attention is never for sale here.</p>\n        <div class=\"socials\">\n          <a href=\"https://www.youtube.com/channel/UCYoFxvZAFr_eBVsNNKQYWKQ\" title=\"YouTube\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 24 24\"><path d=\"M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.9 24 10M-$50M)\">Business owner (revenue $10M-$50M)</option>\n        <option value=\"Business owner (revenue $50M+)\">Business owner (revenue $50M+)</option>\n        <option value=\"Internal leader/employee\">Internal leader/employee</option>\n        <option value=\"Student, retired, other\">Student, retired, other</option>\n      </select>\n      <button type=\"submit\" class=\"btn\">Join DarrenDaily For Free <span class=\"arrow\">&rarr;</span></button>\n      <p class=\"modal-micro\">Free. No ads, ever. Unsubscribe in one click. Your information is never shared.</p>\n    </form>\n  </div>\n</div>\n\n<!-- ============ EXIT-INTENT \"LATEST SESSION\" POPUP ============ -->\n<!-- WEBFLOW: .xp-list is a Collection List bound to Sessions, Sort = Published DESC, Limit = 1\n     (this page is not a session, so there's no current slug to skip). Bind each item's image,\n     date, and link to CMS fields. Auto-updates on publish; the team never resets it. -->\n<div class=\"xp-modal\" id=\"exitPopup\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"xpTitle\" data-current-slug=\"\">\n  <div class=\"xp-card\">\n    <button class=\"xp-close\" type=\"button\" data-xp-close aria-label=\"Close\">\n      <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/></svg>\n    </button>\n    <span class=\"xp-accent\" aria-hidden=\"true\"></span>\n    <div class=\"xp-eyebrow\">Before you go</div>\n    <h3 class=\"xp-title\" id=\"xpTitle\">Don't miss the <em>latest</em>.</h3>\n    <p class=\"xp-sub\">It's live right now, but every DarrenDaily expires in 72 hours. Then it's gone. No exceptions.</p>\n    <div class=\"xp-list\" data-xp-list>\n      <a class=\"xp-session\" href=\"https://dd.darrenhardy.com/high-achievers-do-on-saturdays\" data-session-slug=\"high-achievers-do-on-saturdays\">\n        <img src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e5534df7439ce7c712fa_ep-card-2.webp\" alt=\"Watch: What high-achievers do on Saturdays\" width=\"440\" height=\"244\" loading=\"lazy\">\n        <span class=\"xp-session-date\">Jul 24 &middot; 2026</span>\n      </a>\n      <a class=\"xp-session\" href=\"https://dd.darrenhardy.com/inspiring-real-life-story-for-career-resilience\" data-session-slug=\"inspiring-real-life-story-for-career-resilience\">\n        <img src=\"https://cdn.prod.website-files.com/6a66d7a6f9d116b514a13ae1/6a66e5536c506c4f5d517398_ep-card-3.webp\" alt=\"Watch: An inspiring real-life story for career resilience\" width=\"440\" height=\"244\" loading=\"lazy\">\n        <span class=\"xp-session-date\">Jul 23 &middot; 2026</span>\n      </a>\n    </div>\n\n    <!-- ===================== WEBFLOW-READY (hidden until you activate it) =====================\n         Rebuild the .xp-list above as a COLLECTION LIST, then delete the hardcoded items above.\n           Collection: Sessions   |   Sort: Published date (DESC)   |   Limit: 1   (this page is not a session, nothing to skip)\n         Bind each [[FIELD]] in the Designer (one Collection Item shown; Webflow repeats it):\n           href                   -> the Session item\n           img src                -> \"Card Image\" field\n           img alt                -> \"Title\" field   (IMPORTANT)\n           .xp-session-date text  -> \"Published\" date field\n           data-session-slug attr -> \"Slug\" field\n         Leave #exitPopup data-current-slug empty on this page.\n\n    <div class=\"xp-list\" data-xp-list>\n      <a class=\"xp-session\" href=\"[[SESSION_URL]]\" data-session-slug=\"[[SESSION_SLUG]]\">\n        <img src=\"[[SESSION_CARD_IMAGE]]\" alt=\"[[SESSION_TITLE]]\" width=\"440\" height=\"244\" loading=\"lazy\">\n        <span class=\"xp-session-date\">[[SESSION_PUBLISHED_DATE]]</span>\n      </a>\n    </div>\n         ============================== end WEBFLOW-READY ============================== -->\n  </div>\n</div>\n";


// Nav: transparent at the very top, flips to solid white after a small scroll
  (function () {
    var nav = document.querySelector('nav.top');
    if (!nav) return;
    var ticking = false;
    function update() { ticking = false; nav.classList.toggle('solid', window.scrollY > 24); }
    function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    update();
  })();

  // Scroll reveal
  (function () {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal, .stagger').forEach(function (el) { io.observe(el); });
  })();

  // "Why it expires" video facade: swap the poster for the Vimeo player on click / Enter / Space
  (function () {
    var frame = document.getElementById('whyVideo');
    if (!frame) return;
    function play() {
      var id = frame.getAttribute('data-vimeo-id');
      if (!id || frame.querySelector('iframe')) return;
      var iframe = document.createElement('iframe');
      iframe.src = 'https://player.vimeo.com/video/' + id + '?autoplay=1&color=a72632&title=0&byline=0&portrait=0&dnt=1';
      iframe.allow = 'autoplay; fullscreen; picture-in-picture';
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('title', 'Darren Hardy explains why DarrenDaily expires after 72 hours');
      frame.appendChild(iframe);
      frame.classList.add('playing');
      frame.style.cursor = 'default';
    }
    frame.addEventListener('click', play);
    frame.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); }
    });
  })();

  // Share DarrenDaily: native share sheet with a copy-link fallback
  (function () {
    var SHARE = {
      title: 'DarrenDaily',
      text: 'Daily mentoring with Darren Hardy. One idea, five minutes, every weekday morning. Free.',
      url: 'https://darrendaily.com/'
    };
    var toast = document.getElementById('toast');
    var toastTimer;
    function showToast(msg) {
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
    }
    function share(ev) {
      if (ev) ev.preventDefault();
      if (navigator.share) {
        navigator.share(SHARE).catch(function () {});
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(SHARE.url).then(function () {
          showToast('Link copied. Thank you for sharing.');
        }).catch(function () {
          window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(SHARE.url), '_blank', 'noopener');
        });
        return;
      }
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(SHARE.url), '_blank', 'noopener');
    }
    document.querySelectorAll('[data-share]').forEach(function (el) {
      el.addEventListener('click', share);
    });
  })();

  // Join modal: opt-in form popup (progressive enhancement over the darrendaily.com link)
  (function () {
    var modal = document.getElementById('joinModal');
    if (!modal) return;
    var form = document.getElementById('joinForm');
    var role = document.getElementById('jmRole');
    var firstEl = document.getElementById('jmFirst');
    var lastActive = null;
    function open(ev) {
      if (ev) ev.preventDefault();
      lastActive = document.activeElement;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(function () { if (firstEl) firstEl.focus(); }, 60);
    }
    function close() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      if (lastActive && lastActive.focus) lastActive.focus();
    }
    document.querySelectorAll('[data-open-form]').forEach(function (el) { el.addEventListener('click', open); });
    document.querySelectorAll('[data-close-form]').forEach(function (el) { el.addEventListener('click', close); });
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
    if (role) role.addEventListener('change', function () { role.classList.toggle('filled', !!role.value); });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      // On valid submit, send the new member to the welcome page (wire to HubSpot on launch)
      window.location.href = 'https://darrendaily.webflow.io/welcome';
    });
  })();

  // Exit-intent "latest session" popup (offers the newest session, auto-updating from the CMS)
  (function () {
    var pop = document.getElementById('exitPopup');
    if (!pop) return;
    var STORE = window.sessionStorage;            // once per browsing session (swap to localStorage for longer)
    var SHOWN_KEY = 'dd-exit-shown';
    var CAP_ENABLED = false;                      // TESTING: false = show on every trigger. SET TO true BEFORE LAUNCH.
    var DISMISS_KEY = 'dd-exit-dismissed';        // once the user closes it, stay closed for the rest of the session (even with the cap off)
    function isDismissed() { try { return !!STORE.getItem(DISMISS_KEY); } catch (e) { return false; } }
    var listEl = pop.querySelector('[data-xp-list]');
    var lastActive = null;
    function currentSlug() { var a = pop.getAttribute('data-current-slug'); return a ? a.trim() : ''; }
    function resolveLatest() {
      var cur = currentSlug();
      var items = Array.prototype.slice.call(listEl.querySelectorAll('.xp-session'));
      var shown = null;
      items.forEach(function (it) {
        var slug = (it.getAttribute('data-session-slug') || '').trim();
        if (!shown && slug !== cur) { it.hidden = false; shown = it; } else { it.hidden = true; }
      });
      return shown;
    }
    function canShow() { if (!CAP_ENABLED) return true; try { return !STORE.getItem(SHOWN_KEY); } catch (e) { return true; } }
    function markShown() { if (!CAP_ENABLED) return; try { STORE.setItem(SHOWN_KEY, String(Date.now())); } catch (e) {} }
    function open(force) {
      if (pop.classList.contains('open')) return;
      if (!force && isDismissed()) return;         // user already closed it this session -> stay closed
      if (!force && !canShow()) return;
      if (!resolveLatest()) return;                // nothing to offer -> don't nag
      lastActive = document.activeElement;
      pop.classList.add('open');
      document.body.style.overflow = 'hidden';
      markShown();
      var c = pop.querySelector('[data-xp-close]'); if (c) c.focus();
    }
    function close() {
      pop.classList.remove('open');
      document.body.style.overflow = '';
      try { STORE.setItem(DISMISS_KEY, '1'); } catch (e) {}   // closing = dismissed for this session
      if (lastActive && lastActive.focus) lastActive.focus();
    }
    // Desktop: pointer leaves through the top edge. Mobile: intercept the first back gesture.
    document.addEventListener('mouseout', function (e) {
      if (e.clientY <= 0 && !e.relatedTarget && !e.toElement) open(false);
    });
    try {
      history.pushState(null, '', location.href);
      window.addEventListener('popstate', function () {
        if (canShow()) { history.pushState(null, '', location.href); open(false); }
      });
    } catch (e) {}
    // Also treat a fast upward scroll as leave-intent (helps on trackpads and touch, where mouseout never fires).
    var lastY = window.pageYOffset, lastT = Date.now();
    window.addEventListener('scroll', function () {
      var y = window.pageYOffset, t = Date.now(), dt = (t - lastT) || 1;
      if ((y - lastY) / dt < -0.5 && lastY > 300) open(false);   // ~500px/s upward flick after scrolling down
      lastY = y; lastT = t;
    }, { passive: true });
    // Mobile-friendly signals: reached the end of the page, or went idle.
    // Scroll depth: fire once the reader hits ~90% of the page (they've seen everything).
    var depthTick = false;
    window.addEventListener('scroll', function () {
      if (depthTick) return; depthTick = true;
      requestAnimationFrame(function () {
        depthTick = false;
        var scrolled = window.pageYOffset + window.innerHeight;
        if (scrolled / document.documentElement.scrollHeight >= 0.9) open(false);
      });
    }, { passive: true });
    // Idle: no touch/scroll/tap/keypress for 30s -> about to drift off.
    var idleTimer;
    function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(function () { open(false); }, 30000); }
    ['touchstart', 'scroll', 'click', 'keydown', 'mousemove'].forEach(function (evt) {
      window.addEventListener(evt, resetIdle, { passive: true });
    });
    resetIdle();
    pop.querySelectorAll('[data-xp-close]').forEach(function (el) { el.addEventListener('click', close); });
    pop.addEventListener('click', function (e) { if (e.target === pop) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pop.classList.contains('open')) close(); });
    if (/[?&]exit=1/.test(location.search)) open(true);   // QA: append ?exit=1 to force-preview
  })();

  // ── Media cover bio: SUCCESS covers wall + Darren cutout (ported from darrendaily.html) ──
  (function () {
    var covers = ['JackWelch.jpg', 'SM_13_05_FORD.jpg', 'SM_12_01_DOWNEY.jpg', 'SM_09_07_BRANSON.jpg', 'SM_10_06_JOBS.jpg', 'SM_09_08_FOX.jpg', 'SM_08_01_Kiyosaki.jpg', 'SM_08_02_50.jpg', 'SM_08_04_OZ.jpg', 'SM_08_05_HAWK.jpg', 'SM_08_06_Deutsch.jpg', 'SM_10_12_SHRIVER.jpg', 'SM_09_02_Powell.jpg', 'SM_09_03_FOREMAN.jpg', 'SM_09_04_Maxwell.jpg', 'SM_09_05_ORMAN.jpg', 'SM_09_06_LANCE.jpg', 'SM_09_01_Robbins.jpg', 'SM_09_09_FOSTER_Barcode.jpg', 'SM_09_10_SERENA_barcode.jpg', 'SM_09_11_OSTEEN_barcode.jpg', 'SM_09_12_DrPHIL.jpg', 'SM_12_07_TECHNOLOGY.jpg', 'SM_10_01_KEYES.jpg', 'SM_10_02_RAMSEY.jpg', 'SM_10_03_HOPKINS.jpg', 'SM_10_04_COLLINS.jpg', 'SM_10_05_MICHAELS.jpg', 'SM_10_07_COLE.jpg', 'SM_10_08_JOHNSON.jpg', 'SM_10_09_DELL.jpg', 'SM_10_10_USHER.jpg', 'SM_10_11_MANNINGS.jpg', 'SM_11_01_HOWARD.jpg', 'SM_11_02_CHAN.jpg', 'SM_11_03_SCHWAB.jpg', 'SM_11_04_SCHULTZ.jpg'];

    function cleanName(f) {
      var n = f.replace(/\.(jpg|jpeg|png|gif|webp)$/i, '');
      n = n.replace(/^SM_\d+_\d+_/i, '');
      n = n.replace(/([a-z])([A-Z])/g, '$1 $2');
      n = n.replace(/[_-]/g, ' ');
      n = n.replace(/\bbarcode\b/gi, '').replace(/\s+/g, ' ').trim();
      n = n.toLowerCase().replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      return n;
    }

    var featuredTypes = ['large', 'tall', 'large', 'tall', 'standard'];
    function buildSpreadPool(n) {
      var special = Array(4).fill('wide').concat(Array(16).fill('tall'));
      var s = 0xc0ffee42;
      for (var i = special.length - 1; i > 0; i--) {
        s = Math.imul(s ^ (s >>> 16), 0x45d9f3b);
        s = Math.imul(s ^ (s >>> 16), 0x45d9f3b);
        s ^= s >>> 16;
        var j = (Math.abs(s) >>> 0) % (i + 1);
        var t = special[i]; special[i] = special[j]; special[j] = t;
      }
      var pool = Array(n).fill('standard');
      var step = (n - 1) / (special.length - 1);
      special.forEach(function (type, i) { pool[Math.round(i * step)] = type; });
      return pool;
    }

    var bodyTypes = buildSpreadPool(covers.length - 5);
    var coversGrid = document.getElementById('covers-grid');
    if (!coversGrid) return;

    covers.forEach(function (cover, i) {
      var tile = document.createElement('div');
      tile.className = 'c-tile';
      var t = i < 5 ? featuredTypes[i] : bodyTypes[i - 5];
      if (t === 'wide')  tile.classList.add('c-wide');
      if (t === 'tall')  tile.classList.add('c-tall');
      if (t === 'large') tile.classList.add('c-large');
      var img = document.createElement('img');
      img.src = DD_COVERS[cover.replace(/\.(jpg|jpeg)$/i, '.webp')];
      img.alt = cleanName(cover);
      img.loading = i < 12 ? 'eager' : 'lazy';
      img.decoding = 'async';
      var cap = document.createElement('div');
      cap.className = 'c-cap';
      cap.textContent = cleanName(cover);
      tile.appendChild(img);
      tile.appendChild(cap);
      coversGrid.appendChild(tile);
    });

    // Entrance - reveal tiles when the wall scrolls into view
    var introWall = document.querySelector('.intro-wall');
    var wallObserver = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) {
        requestAnimationFrame(function () {
          document.querySelectorAll('.c-tile').forEach(function (tile) { tile.classList.add('visible'); });
        });
        wallObserver.disconnect();
      }
    }, { threshold: 0.1 });
    wallObserver.observe(introWall);

    // Touch tap-to-color
    document.querySelectorAll('.c-tile').forEach(function (tile) {
      var ty, tx;
      tile.addEventListener('touchstart', function (e) { ty = e.touches[0].clientY; tx = e.touches[0].clientX; }, { passive: true });
      tile.addEventListener('touchend', function (e) {
        if (Math.abs(e.changedTouches[0].clientY - ty) > 8 || Math.abs(e.changedTouches[0].clientX - tx) > 8) return;
        var active = tile.classList.contains('tapped');
        document.querySelectorAll('.c-tile.tapped').forEach(function (t) { t.classList.remove('tapped'); });
        if (!active) tile.classList.add('tapped');
      });
    });

    // Parallax - rAF-throttled (same as homepage)
    (function () {
      var rafPending = false;
      window.addEventListener('scroll', function () {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(function () {
          var rect = introWall.getBoundingClientRect();
          var progress = (window.innerHeight - rect.top) / (window.innerHeight + rect.height);
          var offset = Math.max(0, progress * 500);
          coversGrid.style.transform = 'translateY(-' + offset + 'px)';
          rafPending = false;
        });
      }, { passive: true });
    })();
  })();
