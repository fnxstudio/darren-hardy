<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" width="1600" height="200" role="img" aria-label="Sticky banner placeholder, 1600 by 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#2a1015"/><stop offset="0.55" stop-color="#180a0d"/><stop offset="1" stop-color="#0c0507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.13" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a72632" stop-opacity="0.5"/><stop offset="1" stop-color="#a72632" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="200" fill="url(#bg)"/>
  <rect width="1600" height="200" fill="url(#glow)"/>

  <!-- face / photo placeholder (kept in the vertical safe band ~y44-156 so a thin center-crop keeps it) -->
  <rect x="30" y="48" width="104" height="104" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
  <circle cx="82" cy="92" r="24" fill="#ffffff" fill-opacity="0.20"/>
  <path d="M46 150 q36 -44 72 0" fill="#ffffff" fill-opacity="0.20"/>

  <!-- headline -->
  <text x="170" y="90" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="0.5">THE TRUTH ABOUT</text>
  <text x="170" y="140" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#5fd0e6" letter-spacing="0.5">KIMI K3</text>

  <!-- RIGHT AREA (x >= 1180) LEFT INTENTIONALLY CLEAR for the overlaid, clickable CTA button -->
  <text x="1560" y="30" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.4" letter-spacing="1">PLACEHOLDER · 1600 × 200 · KEEP RIGHT ~25% CLEAR FOR CTA</text>
</svg>
