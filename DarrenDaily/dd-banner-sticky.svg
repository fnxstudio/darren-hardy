<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" width="1600" height="200" role="img" aria-label="Sticky banner placeholder, 1600 by 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1015"/><stop offset="0.55" stop-color="#180a0d"/><stop offset="1" stop-color="#0c0507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#a72632" stop-opacity="0.55"/><stop offset="1" stop-color="#a72632" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="200" fill="url(#bg)"/>
  <rect width="1600" height="200" fill="url(#glow)"/>

  <!-- face / photo placeholder -->
  <rect x="34" y="20" width="160" height="160" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
  <circle cx="114" cy="86" r="30" fill="#ffffff" fill-opacity="0.20"/>
  <path d="M66 172 q48 -58 96 0" fill="#ffffff" fill-opacity="0.20"/>

  <!-- headline -->
  <text x="232" y="80" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="0.5">THE TRUTH ABOUT</text>
  <text x="232" y="132" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#5fd0e6" letter-spacing="0.5">KIMI K3</text>

  <!-- live line -->
  <circle cx="242" cy="160" r="7" fill="#ff3b3b"/>
  <text x="260" y="167" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1.5">LIVE  ·  TODAY 1PM ET</text>

  <!-- CTA button -->
  <rect x="1218" y="66" width="332" height="66" rx="8" fill="#2fd3d8"/>
  <text x="1384" y="108" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#082a2d" letter-spacing="1.5">SAVE YOUR SEAT</text>

  <!-- placeholder tag -->
  <text x="1566" y="28" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" fill-opacity="0.4" letter-spacing="1.5">PLACEHOLDER  ·  1600 × 200  ·  REPLACE WITH REAL CREATIVE</text>
</svg>
